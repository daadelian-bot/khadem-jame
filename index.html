<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه جامع خادم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f5f7fb;color:#18212f;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}.top{background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.card{background:white;border:1px solid #e3e7ee;border-radius:16px;padding:18px;margin:16px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:10px;font:inherit;box-sizing:border-box}
label{display:block;font-size:13px;font-weight:bold;margin:8px 0 5px}
button{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:bold;cursor:pointer}
.primary{background:#087f5b;color:white}.secondary{background:#eef2f7}.danger{background:#ffe8e8;color:#a00}
.hidden{display:none!important}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1 1 230px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}
.code{background:#e6f4ef;color:#087f5b;padding:4px 7px;border-radius:7px;font-weight:bold;margin-left:7px}
.avatar{width:44px;height:44px;object-fit:cover;border-radius:10px;background:#eee}.badge{padding:4px 8px;border-radius:20px}.on{background:#e6f7ef;color:#087f5b}.off{background:#eee}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid #e3e7ee;border-radius:14px;padding:15px}.stat b{display:block;font-size:24px;margin-top:5px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbox{background:white;border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
.msg{padding:10px;border-radius:9px;margin:10px 0;background:#ffecec;color:#900}
</style>
</head>
<body>
<div class="top"><div class="wrap"><b>سامانه جامع خادم</b><span id="user" style="float:left"></span></div></div>
<main class="wrap">
<section id="login" class="card" style="max-width:430px;margin:8vh auto">
<h2>ورود به سامانه</h2><div id="loginMsg" class="hidden"></div>
<label>ایمیل</label><input id="email" type="email">
<label>رمز عبور</label><input id="password" type="password">
<button id="loginBtn" class="primary" style="width:100%;margin-top:12px">ورود</button>
</section>

<section id="app" class="hidden">
<div class="stats"><div class="stat">کل خدام<b id="total">۰</b></div><div class="stat">فعال<b id="active">۰</b></div><div class="stat">غیرفعال<b id="inactive">۰</b></div></div>
<div class="card"><input id="search" placeholder="جستجو: کد خادم، نام، کد ملی، تلفن..."><br><br><button id="add" class="primary">افزودن خادم</button> <button id="logout" class="secondary">خروج</button></div>
<div class="card tablewrap"><table class="table"><thead><tr><th>عکس</th><th>خادم</th><th>نام پدر</th><th>کد ملی</th><th>تلفن</th><th>مسئولیت</th><th>خدمت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>

<div id="modal" class="modal hidden"><div class="modalbox">
<h2 id="mt">افزودن خادم</h2><div id="fm" class="hidden"></div>
<div class="row">
<div class="field"><label>کد خادم *</label><input id="code"></div>
<div class="field"><label>نام خادم *</label><input id="name"></div>
<div class="field"><label>نام پدر</label><input id="father"></div>
<div class="field"><label>کد ملی</label><input id="nid"></div>
<div class="field"><label>تلفن</label><input id="phone"></div>
<div class="field"><label>تاریخ عضویت</label><input id="date" type="date"></div>
<div class="field"><label>مسئولیت</label><input id="resp"></div>
<div class="field"><label>تعداد خدمت</label><input id="sc" type="number" min="0" value="0"></div>
<div class="field"><label>تعداد روز خدمت</label><input id="sd" type="number" min="0" value="0"></div>
<div class="field"><label>وضعیت</label><select id="activeSel"><option value="true">فعال</option><option value="false">غیرفعال</option></select></div>
<div class="field"><label>عکس</label><input id="photo" type="file" accept="image/*"></div>
<div class="field" style="flex-basis:100%"><label>توضیحات</label><textarea id="desc"></textarea></div>
</div><br><button id="save" class="primary">ذخیره</button> <button id="close" class="secondary">انصراف</button>
</div></div>

<script>
const SUPABASE_URL="https://fxxtyfurdzpfzvweoppo.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let profile=null,rows=[] ,editing=null;
const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);

async function start(){
 if(SUPABASE_ANON_KEY.includes("PASTE_")){$("loginMsg").textContent="کلید Publishable/Anon را در index.html وارد کنید";$("loginMsg").className="msg";return}
 const {data:{session}}=await sb.auth.getSession(); if(session) enter();
}
async function enter(){
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 const p=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(p.error||!p.data?.is_active){alert("حساب فعال نیست");return}
 profile=p.data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("user").textContent=profile.full_name||"کاربر";
 $("add").classList.toggle("hidden",!["admin","manager"].includes(profile.role));load();
}
async function load(){
 const r=await sb.from("khadems").select("*").order("khadem_code");if(r.error)return alert(r.error.message);
 rows=r.data||[];render(rows);
}
function render(list){
 $("total").textContent=fa(list.length);$("active").textContent=fa(list.filter(x=>x.is_active).length);$("inactive").textContent=fa(list.filter(x=>!x.is_active).length);
 $("rows").innerHTML=list.map(x=>`<tr><td>${x.photo_url?`<img class="avatar" src="${esc(x.photo_url)}">`:""}</td>
 <td><span class="code">${esc(x.khadem_code)}</span><b>${esc(x.full_name)}</b></td><td>${esc(x.father_name||"—")}</td><td>${esc(x.national_id||"—")}</td>
 <td>${esc(x.phone||"—")}</td><td>${esc(x.responsibility||"—")}</td><td>${fa(x.service_count||0)} خدمت / ${fa(x.service_days||0)} روز</td>
 <td><span class="badge ${x.is_active?"on":"off"}">${x.is_active?"فعال":"غیرفعال"}</span></td>
 <td><button class="secondary" onclick="editRow('${x.id}')">ویرایش</button>${profile.role==="admin"?` <button class="danger" onclick="delRow('${x.id}')">حذف</button>`:""}</td></tr>`).join("");
}
function openForm(x){
 editing=x?.id||null;$("mt").textContent=x?"ویرایش خادم":"افزودن خادم";$("fm").className="hidden";$("fm").textContent="";
 $("code").value=x?.khadem_code||"";$("name").value=x?.full_name||"";$("father").value=x?.father_name||"";$("nid").value=x?.national_id||"";
 $("phone").value=x?.phone||"";$("date").value=x?.membership_date||"";$("resp").value=x?.responsibility||"";$("sc").value=x?.service_count||0;$("sd").value=x?.service_days||0;
 $("activeSel").value=String(x?.is_active??true);$("desc").value=x?.description||"";$("photo").value="";$("modal").classList.remove("hidden");
}
window.editRow=id=>openForm(rows.find(x=>x.id===id));
window.delRow=async id=>{if(!confirm("حذف شود؟"))return;let r=await sb.from("khadems").delete().eq("id",id);if(r.error)alert(r.error.message);else load()};
$("add").onclick=()=>openForm();$("close").onclick=()=>$("modal").classList.add("hidden");
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("loginBtn").onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error){$("loginMsg").textContent=r.error.message;$("loginMsg").className="msg"}else enter()};
$("search").oninput=e=>{let q=e.target.value.toLowerCase();render(rows.filter(x=>[x.khadem_code,x.full_name,x.national_id,x.phone,x.responsibility].some(v=>String(v||"").toLowerCase().includes(q))))};
$("save").onclick=async()=>{
 const p={khadem_code:$("code").value.trim(),full_name:$("name").value.trim(),father_name:$("father").value.trim()||null,national_id:$("nid").value.trim()||null,
 phone:$("phone").value.trim()||null,membership_date:$("date").value||null,responsibility:$("resp").value.trim()||null,service_count:+$("sc").value||0,service_days:+$("sd").value||0,
 is_active:$("activeSel").value==="true",description:$("desc").value.trim()||null};
 if(!p.khadem_code||!p.full_name){$("fm").textContent="کد خادم و نام الزامی است";$("fm").className="msg";return}
 let f=$("photo").files[0];
 if(f){let ext=(f.name.split(".").pop()||"jpg").toLowerCase(),path=crypto.randomUUID()+"."+ext,u=await sb.storage.from("khadem-photos").upload(path,f);if(u.error){$("fm").textContent=u.error.message;$("fm").className="msg";return}
 let s=await sb.storage.from("khadem-photos").createSignedUrl(path,31536000);if(!s.error)p.photo_url=s.data.signedUrl}
 let r=editing?await sb.from("khadems").update(p).eq("id",editing):await sb.from("khadems").insert(p);
 if(r.error){$("fm").textContent=r.error.message;$("fm").className="msg";return}
 $("modal").classList.add("hidden");load();
};
start();
</script>
</body></html>
