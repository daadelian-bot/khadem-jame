<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه جامع مدیریت خادمین (نسخه ۲)</title>
    <link rel="stylesheet" href="styles.css">
    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="لوگو">
        </div>
        <h1>سامانه جامع مدیریت خادمین</h1>
    </header>

    <main id="main-content">
        <!-- وضعیت اتصال -->
        <div class="card">
            <h2>وضعیت سامانه</h2>
            <p id="connection-status">در حال بررسی اتصال به پایگاه داده...</p>
        </div>
        
        <!-- فرم ثبت خادم جدید -->
        <div class="card">
            <h3>ثبت خادم جدید</h3>
            <form id="khadem-form">
                <input type="text" id="khadem-name" class="form-control" placeholder="نام و نام خانوادگی" required>
                <input type="tel" id="khadem-phone" class="form-control" placeholder="شماره تماس">
                <select id="khadem-section" class="form-control">
                    <option value="عمومی">بخش خدمت: عمومی</option>
                    <option value="فرهنگی">بخش فرهنگی</option>
                    <option value="تدارکات">بخش تدارکات و پشتیبانی</option>
                    <option value="مالی">بخش مالی</option>
                    <option value="مداحی و قرائت">بخش مداحی و قرائت</option>
                </select>
                <button type="submit" class="btn-primary">ثبت اطلاعات خادم</button>
            </form>
        </div>

        <!-- لیست خادمین ثبت‌شده -->
        <div class="card">
            <h3>بانک خادمین</h3>
            <div id="khadem-list">در حال بارگذاری لیست...</div>
        </div>
    </main>

    <!-- اسکریپت اصلی اتصال و منطق برنامه -->
    <script src="app.js"></script>
</body>
</html>
