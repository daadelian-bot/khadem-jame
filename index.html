<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7b1e1e">
<title>سامانه جامع مدیریت خدام</title>

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app">

<header class="top">
  <div class="brand">
    <img src="logo.png" alt="لوگو">
    <div>
      <h1>سامانه جامع مدیریت خدام</h1>
      <small>مدیریت یکپارچه خادمین، خدمت، جلسات و امور مجموعه</small>
    </div>
  </div>

  <span class="pill ok">آماده استفاده</span>
</header>

<div class="layout">

  <aside>
    <div class="nav" id="nav"></div>
  </aside>

  <main id="main">

    <section class="section">

      <h2>🏠 داشبورد</h2>

      <div class="cards">

        <div class="card">
          کل خادمین
          <div class="num">۰</div>
        </div>

        <div class="card">
          خدمت اصلی
          <div class="num">۰</div>
        </div>

        <div class="card">
          شب‌های جمعه
          <div class="num">۰</div>
        </div>

        <div class="card">
          جلسات
          <div class="num">۰</div>
        </div>

      </div>

      <div class="card" style="margin-top:16px">

        <h3>سامانه آماده است</h3>

        <p class="muted">
          برای اتصال به اطلاعات آنلاین، از بخش ورود استفاده کنید.
        </p>

        <button class="btn" onclick="window.KJ.showLogin()">
          ورود به سامانه
        </button>

      </div>

    </section>

  </main>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
