<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه جامع خادمین مجموعة السیدة زینب سلام الله علیها</title><link rel="icon" type="image/png" href="logo.png"><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--primary:#176b4d;--muted:#6b7280;--danger:#c0392b;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;background:#123b2e;color:#fff;padding:18px;position:fixed;right:0;top:0;bottom:0;overflow:auto}.side h1{font-size:18px;margin:4px 0 20px}.nav button{width:100%;border:0;background:transparent;color:#e9fff6;text-align:right;padding:12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#1d684f}.main{margin-right:250px;padding:24px;width:calc(100% - 250px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #00000008;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:26px;font-weight:700;margin-top:8px}.muted{color:var(--muted);font-size:13px}.btn{background:var(--primary);color:#fff;border:0;border-radius:9px;padding:9px 14px}.btn.gray{background:#6b7280}.btn.red{background:var(--danger)}.btn.light{background:#eef4f1;color:#175c45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5dae0;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:80px}.req label:after{content:' *';color:#c0392b}.error{color:#c0392b;font-size:12px;margin-top:3px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:right;font-size:13px}.table th{background:#f7f8f9}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px}.green{background:#dff5e9;color:#147443}.yellow{background:#fff1c9;color:#8a6200}.redbg{background:#ffe0dd;color:#9c271d}.chart{height:220px;display:flex;align-items:end;gap:12px;padding:20px}.bar{flex:1;background:#2b8a67;border-radius:7px 7px 0 0;min-height:15px;position:relative}.bar span{position:absolute;top:-22px;font-size:11px;width:100%;text-align:center}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:20px}.search{width:100%;padding:11px;border:1px solid #d5dae0;border-radius:9px;margin-bottom:12px}.toast{position:fixed;bottom:20px;left:20px;background:#18212b;color:#fff;padding:11px 15px;border-radius:9px;display:none;z-index:20}@media(max-width:800px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:14px}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;gap:8px}}
.brand-logo{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 8px;border-radius:14px}.brand-title{text-align:center;font-weight:800;line-height:1.7}.searchbox{display:flex;gap:8px;flex-wrap:wrap}.searchbox input{flex:1;min-width:220px}.kpi{position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;left:-25px;bottom:-35px;width:90px;height:90px;border-radius:50%;background:#2b8a6715}.progress{height:14px;background:#e9eef0;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:#2b8a67;border-radius:999px}.mini-chart{display:flex;align-items:end;gap:8px;height:180px;padding:10px 0}.mini-bar{flex:1;background:#2b8a67;border-radius:6px 6px 0 0;min-height:8px;position:relative}.mini-bar span{position:absolute;top:-20px;right:0;left:0;text-align:center;font-size:11px}.mini-label{font-size:11px;text-align:center;margin-top:4px}.clickable{cursor:pointer}.settings-preview{width:100%;height:90px;border-radius:12px;border:1px solid var(--line);background-size:cover;background-position:center}</style></head><body><div class="app"><aside class="side"><img class="brand-logo" src="logo.png" alt="لوگوی سامانه"><div class="brand-title">سامانه جامع خادمین<br>مجموعة السیدة زینب سلام الله علیها</div><div class="muted" style="color:#bde3d3">نسخه ۶ • مدیریت مجموعه</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h2 id="title" style="margin:0"></h2><div class="muted">ذخیره‌سازی خودکار فعال است</div></div><div class="row"><button class="btn light" onclick="toggleDark()">☀️/🌙</button><button class="btn" onclick="backup()">پشتیبان</button></div></div><div id="view"></div></main></div><div id="modal" class="modal"><div class="modalbox"><div class="row" style="justify-content:space-between"><h3 id="modalTitle"></h3><button class="btn red" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><script>
const fa=n=>String(n??'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const en=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const today=()=>new Date().toLocaleDateString('fa-IR');
let db=JSON.parse(localStorage.getItem('khademV5')||'{"servants":[],"services":[],"night":[],"meetings":[],"finance":[],"roles":[],"activity":[]}');let current=localStorage.getItem('khademLast')||'dashboard';let dark=localStorage.getItem('khademDark')==='1';
const pages={dashboard:'داشبورد مدیریت',servants:'بانک خدام',services:'سوابق خدمت',night:'پایش خدمت شب جمعه',meetings:'جلسات و حضور غیاب',finance:'امور مالی',roles:'ساختار مسئولیت‌ها',settings:'تنظیمات',guide:'راهنما'};
function save(){localStorage.setItem('khademV5',JSON.stringify(db));localStorage.setItem('khademLast',current)}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function nav(){document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${current===k?'active':''}" onclick="go('${k}')">${({dashboard:'🏠',servants:'👤',services:'🕌',night:'🌙',meetings:'📋',finance:'💰',roles:'🌳',settings:'⚙️',guide:'❓'})[k]} ${v}</button>`).join('')}function go(p){current=p;save();nav();document.getElementById('title').textContent=pages[p];({dashboard,servants,services,night,meetings,finance,roles,settings,guide}[p])()}function toggleDark(){dark=!dark;localStorage.setItem('khademDark',dark?'1':'0');document.documentElement.style.setProperty('--bg',dark?'#111827':'#f4f6f8');document.documentElement.style.setProperty('--card',dark?'#1f2937':'#fff');document.documentElement.style.setProperty('--text',dark?'#f3f4f6':'#18212b');}
function dashboard(){let total=db.servants.length, active=db.servants.filter(x=>x.active).length, sv=db.services.length, ni=db.night.length, meets=db.meetings.length;document.getElementById('view').innerHTML=`<div class="card"><div class="searchbox"><input class="search" id="dashq" placeholder="جستجوی نام یا کد خادم..." oninput="dashboardSearch()"><button class="btn light" onclick="dashboardSearch(true)">پاک کردن</button></div><div id="dashresults"></div></div><div class="grid"><div class="card kpi clickable" onclick="go('servants')">خدام<br><div class="stat">${fa(total)}</div></div><div class="card kpi clickable" onclick="go('servants')">خدام فعال<br><div class="stat">${fa(active)}</div></div><div class="card kpi clickable" onclick="go('services')">خدمت رسمی<br><div class="stat">${fa(sv)}</div></div><div class="card kpi clickable" onclick="go('night')">خدمت شب جمعه<br><div class="stat">${fa(ni)}</div></div><div class="card kpi clickable" onclick="go('meetings')">جلسات<br><div class="stat">${fa(meets)}</div></div></div><div class="grid"><div class="card"><h3>آمار حضور جلسات</h3>${meetingStats()}</div><div class="card"><h3>وضعیت خدمت شب جمعه</h3>${nightStats()}</div></div><div class="card"><h3>تعداد خدمت‌ها به تفکیک</h3>${serviceChart()}</div>`;dashboardSearch()}
function dashboardSearch(clear){let el=document.getElementById('dashq');if(!el)return;if(clear)el.value='';let q=el.value.trim();let box=document.getElementById('dashresults');if(!q){box.innerHTML='<div class="muted">برای مشاهده پرونده کامل، نام یا کد خادم را جستجو کنید.</div>';return}let arr=db.servants.filter(s=>String(s.name||'').includes(q)||String(s.code||'').includes(q));box.innerHTML=arr.length?arr.map(s=>{let ss=db.services.filter(x=>x.sid===s.id),nn=db.night.filter(x=>x.sid===s.id),pp=db.finance.filter(x=>x.sid===s.id),aa=db.meetings.flatMap(m=>m.att).filter(x=>x.sid===s.id),hp=aa.filter(x=>x.status==='حاضر').length;return `<div class="card clickable" onclick="profile('${s.id}')"><div class="row"><b>کد خادم: ${fa(s.code)}</b><span>${s.name}</span><span>رسمی: ${fa(ss.length)}</span><span>شب جمعه: ${fa(nn.length)}</span><span>جلسات: ${fa(hp)}/${fa(aa.length)}</span><span>پرداخت: ${fa(pp.reduce((a,x)=>a+Number(x.amount||0),0))}</span><span>بدهی: ${fa(pp.reduce((a,x)=>a+Number(x.debt||0),0))}</span></div></div>`}).join(''):'<div class="error">خادمی با این نام یا کد پیدا نشد.</div>'}
function serviceChart(){let r=db.servants.map(s=>({name:s.name,total:db.services.filter(x=>x.sid===s.id).length+db.night.filter(x=>x.sid===s.id).length})).sort((a,b)=>b.total-a.total).slice(0,8),mx=Math.max(1,...r.map(x=>x.total));return `<div class="mini-chart">${r.map(x=>`<div style="flex:1"><div class="mini-bar" style="height:${Math.max(8,x.total/mx*150)}px"><span>${fa(x.total)}</span></div><div class="mini-label">${x.name}</div></div>`).join('')}</div>`}
function meetingStats(){let total=0,p=0;db.meetings.forEach(m=>m.att.forEach(a=>{total++;if(a.status==='حاضر')p++}));let pct=total?Math.round(p*100/total):0;return `<div class="grid"><div>کل ثبت حضور: <b>${fa(total)}</b></div><div>حاضر: <b>${fa(p)}</b></div><div>درصد حضور: <b>${fa(pct)}٪</b></div></div><div class="chart"><div class="bar" style="height:${Math.max(10,pct)}%"><span>${fa(pct)}٪</span></div></div>`}
function nightStats(){let todayD=new Date();let due=0;db.servants.forEach(s=>{let n=db.night.filter(x=>x.sid===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];let days=n?Math.floor((todayD-new Date(n.date))/86400000):999;if(days>=45&&s.active)due++});return `<div class="grid"><div>نیازمند پیگیری: <b class="badge redbg">${fa(due)}</b></div><div>قانون: <b>۴۵ روز</b></div></div>`}
function servants(){let q='';document.getElementById('view').innerHTML=`<div class="card"><div class="row"><input class="search" id="sq" placeholder="جستجو در نام، کد خادم، کد ملی، معرف..." oninput="renderServants()"><button class="btn" onclick="openServant()">+ ثبت خادم جدید</button></div><div id="st"></div></div>`;renderServants()}
function renderServants(){let q=(document.getElementById('sq')?.value||'').trim();let arr=db.servants.filter(s=>JSON.stringify(s).includes(q));document.getElementById('st').innerHTML=`<table class="table"><tr><th>عکس</th><th>خادم</th><th>معرف</th><th>مسئولیت اصلی</th><th>وضعیت</th><th>عملیات</th></tr>${arr.map(s=>`<tr><td>${s.photo?`<img src="${s.photo}" style="width:40px;height:40px;object-fit:cover;border-radius:50%">`:'—'}</td><td><b>${fa(s.code)}</b> — ${s.name}</td><td>${s.referrer}</td><td>${s.role}</td><td>${s.active?'فعال':'غیرفعال'}</td><td><button class="btn light" onclick="profile('${s.id}')">پرونده</button> <button class="btn red" onclick="del('servants','${s.id}')">حذف</button></td></tr>`).join('')}</table>`}
function openServant(){modal('ثبت خادم جدید',`<form id="sf"><div class="form"><div class="field req"><label>کد خادم</label><input name="code"></div><div class="field req"><label>نام و نام خانوادگی</label><input name="name"></div><div class="field req"><label>نام پدر</label><input name="father"></div><div class="field req"><label>کد ملی</label><input name="national"></div><div class="field req"><label>نام ثلاثی</label><input name="three"></div><div class="field req"><label>تاریخ عضویت شمسی</label><input name="join" placeholder="۱۴۰۵/۰۷/۱۵"></div><div class="field req"><label>شماره تلفن</label><input name="phone" type="tel"></div><div class="field"><label>معرف خادم</label><input name="referrer" placeholder="نام معرف را وارد کنید"></div><div class="field"><label>مسئولیت اصلی</label><input name="role" placeholder="مسئولیت را وارد کنید"></div><div class="field req"><label>وضعیت</label><select name="active"><option value="1">فعال</option><option value="0">غیرفعال</option></select></div><div class="field"><label>عکس خادم</label><input name="photo" type="file" accept="image/*"></div><div class="field"><label>توضیحات</label><textarea name="desc"></textarea></div></div><div id="errs"></div><button class="btn" type="submit">ثبت خادم</button></form>`);document.getElementById('sf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target), req=['code','name','father','national','three','join','phone','active'], labels={code:'کد خادم',name:'نام و نام خانوادگی',father:'نام پدر',national:'کد ملی',three:'نام ثلاثی',join:'تاریخ عضویت',phone:'شماره تلفن',active:'وضعیت'};let miss=req.filter(k=>!String(f.get(k)||'').trim());if(miss.length){document.getElementById('errs').innerHTML=`<div class="error">لطفاً موارد زیر را تکمیل کنید: ${miss.map(x=>labels[x]).join('، ')}</div>`;return}let file=e.target.photo.files[0];let done=photo=>{db.servants.push({id:crypto.randomUUID(),code:fa(f.get('code')),name:f.get('name'),father:f.get('father'),national:f.get('national'),three:f.get('three'),join:f.get('join'),phone:f.get('phone'),referrer:f.get('referrer'),role:f.get('role'),active:f.get('active')==='1',photo,desc:f.get('desc')});save();closeModal();servants();toast('خادم با موفقیت ثبت شد')};if(file){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}else done('')};}
function profile(id){let s=db.servants.find(x=>x.id===id), ss=db.services.filter(x=>x.sid===id), nn=db.night.filter(x=>x.sid===id), pp=db.finance.filter(x=>x.sid===id), mm=db.meetings.flatMap(m=>m.att.filter(a=>a.sid===id));modal('پرونده خادم',`<div class="card"><div class="row">${s.photo?`<img src="${s.photo}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`:''}<div><h3>${s.name}</h3><div>کد: ${fa(s.code)} | تلفن: <a href="tel:${s.phone}">${s.phone}</a></div><div>معرف: ${s.referrer||'—'} | مسئولیت: ${s.role||'—'}</div></div></div></div><div class="grid"><div class="card">خدمت رسمی<br><b>${fa(ss.length)}</b></div><div class="card">شب جمعه<br><b>${fa(nn.length)}</b></div><div class="card">جلسات حاضر<br><b>${fa(mm.filter(a=>a.status==='حاضر').length)}</b></div><div class="card">مانده مالی<br><b>${fa(pp.reduce((a,x)=>a+(Number(x.debt)||0),0))}</b></div></div><div class="card"><h4>خط زمانی</h4>${[...ss.map(x=>`خدمت رسمی • ${x.date} • ${x.type}`),...nn.map(x=>`شب جمعه • ${x.date}`),...pp.map(x=>`مالی • ${x.date} • ${x.type} • ${fa(x.amount)}`)].sort().map(x=>`<div style="padding:6px;border-bottom:1px solid #eee">${x}</div>`).join('')}</div>`)}
function services(){document.getElementById('view').innerHTML=`<div class="card"><div class="row"><button class="btn" onclick="openService(false)">+ ثبت خدمت رسمی</button><button class="btn light" onclick="openService(true)">+ ثبت خدمت شب جمعه</button></div><div class="muted">خدمت شب جمعه کاملاً مستقل از خدمت‌های رسمی است.</div></div><div class="card"><table class="table"><tr><th>کد خادم</th><th>خادم</th><th>خدمت</th><th>تاریخ شروع</th><th>تاریخ پایان</th><th>محل</th><th>راننده</th><th>حذف</th></tr>${[...db.services.map(x=>({...x,night:false})),...db.night.map(x=>({...x,night:true}))].map(x=>{let s=db.servants.find(s=>s.id===x.sid);return `<tr><td>${fa(s?.code||'—')}</td><td>${s?.name||'—'}</td><td>${x.night?'شب جمعه':'رسمی'}</td><td>${x.date||'—'}</td><td>${x.end||'—'}</td><td>${x.place||'—'}</td><td>${x.driver||'—'}</td><td><button class="btn red" onclick="del('${x.night?'night':'services'}','${x.id}')">حذف</button></td></tr>`}).join('')}</table></div>`}
function openService(isNight){modal(isNight?'ثبت خدمت شب جمعه':'ثبت خدمت رسمی',`<form id="svf"><div class="form"><div class="field req"><label>خادم</label><select name="sid">${db.servants.map(s=>`<option value="${s.id}">${s.name} — ${fa(s.code)}</option>`).join('')}</select></div><div class="field req"><label>تاریخ شروع شمسی</label><input name="date" placeholder="۱۴۰۵/۰۷/۱۵"></div><div class="field"><label>تاریخ پایان شمسی</label><input name="end" placeholder="۱۴۰۵/۰۷/۱۷"></div><div class="field"><label>محل خدمت</label><input name="place"></div><div class="field"><label>راننده</label><input name="driver" placeholder="نام راننده"></div><div class="field"><label>مبدأ</label><input name="origin"></div><div class="field"><label>وسیله حمل‌ونقل</label><input name="transport"></div><div class="field"><label>توضیحات</label><textarea name="desc"></textarea></div></div><button class="btn">ثبت</button></form>`);document.getElementById('svf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target), x={id:crypto.randomUUID(),sid:f.get('sid'),date:f.get('date'),end:f.get('end'),place:f.get('place'),origin:f.get('origin'),transport:f.get('transport'),driver:f.get('driver'),desc:f.get('desc')};(isNight?db.night:db.services).push(x);save();closeModal();services();toast('سابقه خدمت ثبت شد')}}
function night(){let rows=db.servants.map(s=>{let n=db.night.filter(x=>x.sid===s.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];let days=n?Math.floor((new Date()-new Date(n.date))/86400000):999;let cls=days>=45?'redbg':days>=35?'yellow':'green';return `<tr><td><b>${fa(s.code)}</b> — ${s.name}</td><td>${n?.date||'ثبت نشده'}</td><td><span class="badge ${cls}">${fa(days)} روز</span></td><td><button class="btn light" onclick="openService(true);setTimeout(()=>{},0)">تصحیح/ثبت</button></td></tr>`}).join('');document.getElementById('view').innerHTML=`<div class="card"><h3>پایش خدمت شب جمعه</h3><div class="muted">قانون پیش‌فرض: هر خادم فعال حداقل یک خدمت شب جمعه در هر ۴۵ روز. این محاسبه مستقل از خدمت‌های رسمی است.</div></div><div class="card"><table class="table"><tr><th>خادم</th><th>آخرین شب جمعه</th><th>روزهای گذشته</th><th>عملیات</th></tr>${rows}</table></div>`}
function meetings(){document.getElementById('view').innerHTML=`<div class="card"><button class="btn" onclick="openMeeting()">+ ثبت جلسه جدید</button></div><div class="card"><table class="table"><tr><th>جلسه</th><th>تاریخ</th><th>ساعت</th><th>حاضر</th><th>غایب</th><th>درصد</th><th>حذف</th></tr>${db.meetings.map(m=>{let p=m.att.filter(a=>a.status==='حاضر').length,t=m.att.length;return `<tr><td>${m.title}</td><td>${m.date}</td><td>${m.time}</td><td>${fa(p)}</td><td>${fa(t-p)}</td><td>${fa(t?Math.round(p*100/t):0)}٪</td><td><button class="btn red" onclick="del('meetings','${m.id}')">حذف</button></td></tr>`}).join('')}</table></div><div class="card"><h3>آمار کل خدام</h3>${db.servants.map(s=>{let a=db.meetings.flatMap(m=>m.att).filter(x=>x.sid===s.id),p=a.filter(x=>x.status==='حاضر').length;return `<div style="padding:7px;border-bottom:1px solid #eee">${s.name}: ${fa(p)} از ${fa(a.length)} جلسه — ${fa(a.length?Math.round(p*100/a.length):0)}٪</div>`}).join('')}</div>`}
function openMeeting(){modal('ثبت جلسه و حضور غیاب',`<form id="mf"><div class="form"><div class="field req"><label>عنوان جلسه</label><input name="title"></div><div class="field req"><label>تاریخ شمسی</label><input name="date"></div><div class="field"><label>ساعت</label><input name="time"></div><div class="field"><label>محل</label><input name="place"></div></div><h4>وضعیت حضور</h4><table class="table">${db.servants.map(s=>`<tr><td>${s.name}</td><td><select data-sid="${s.id}"><option>حاضر</option><option>غایب</option></select></td></tr>`).join('')}</table><button class="btn">ثبت جلسه</button></form>`);document.getElementById('mf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target), att=[...e.target.querySelectorAll('select[data-sid]')].map(x=>({sid:x.dataset.sid,status:x.value}));db.meetings.push({id:crypto.randomUUID(),title:f.get('title'),date:f.get('date'),time:f.get('time'),place:f.get('place'),att});save();closeModal();meetings();toast('جلسه ثبت شد')}}
function finance(){let types=['شهریه','کمک هزینه هیئت','کمک به صندوق','البسه و تجهیزات','سایر'];document.getElementById('view').innerHTML=`<div class="card"><div class="row">${types.map(t=>`<button class="btn light" onclick="financeFilter('${t}')">${t}</button>`).join('')}<button class="btn" onclick="openFinance()">+ ثبت مالی</button></div></div><div id="fin"><table class="table"><tr><th>استثنا</th><th>خادم</th><th>شهریه</th><th>هیئت</th><th>صندوق</th><th>البسه/تجهیزات</th><th>کل پرداخت</th><th>بدهی</th><th>توضیحات</th><th>حذف</th></tr>${db.servants.map(s=>finRow(s)).join('')}</table></div>`}function finRow(s){let fs=db.finance.filter(x=>x.sid===s.id), sum=t=>fs.filter(x=>x.type===t).reduce((a,x)=>a+Number(x.amount||0),0), paid=fs.reduce((a,x)=>a+Number(x.amount||0),0), debt=fs.reduce((a,x)=>a+Number(x.debt||0),0);return `<tr><td><input type="checkbox" ${s.exception?'checked':''} onchange="toggleException('${s.id}',this.checked)"></td><td><b>${fa(s.code)}</b> — ${s.name}</td><td>${fa(sum('شهریه'))}</td><td>${fa(sum('کمک هزینه هیئت'))}</td><td>${fa(sum('کمک به صندوق'))}</td><td>${fa(sum('البسه و تجهیزات'))}</td><td>${fa(paid)}</td><td class="${debt?'redbg':''}">${fa(debt)}</td><td>${fs.map(x=>x.desc).filter(Boolean).join(' | ')||'—'}</td><td><button class="btn light" onclick="openFinance('${s.id}')">ثبت</button></td></tr>`}function financeFilter(t){document.getElementById('fin').innerHTML=`<div class="card"><h3>${t}</h3><table class="table"><tr><th>خادم</th><th>مبلغ</th><th>بدهی</th><th>توضیحات</th></tr>${db.servants.map(s=>db.finance.filter(x=>x.sid===s.id&&x.type===t).map(x=>`<tr><td><b>${fa(s.code)}</b> — ${s.name}</td><td>${fa(x.amount)}</td><td>${fa(x.debt)}</td><td>${x.desc||'—'}</td></tr>`).join('')).join('')}</table></div>`}function toggleException(id,v){let s=db.servants.find(x=>x.id===id);s.exception=v;save();finance()}function openFinance(sid){modal('ثبت مالی',`<form id="ff"><div class="form"><div class="field req"><label>خادم</label><select name="sid">${db.servants.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${s.name} — ${fa(s.code)}</option>`).join('')}</select></div><div class="field req"><label>نوع مالی</label><select name="type"><option>شهریه</option><option>کمک هزینه هیئت</option><option>کمک به صندوق</option><option>البسه و تجهیزات</option><option>سایر</option></select></div><div class="field"><label>مبلغ پرداخت</label><input name="amount" type="number"></div><div class="field"><label>مبلغ بدهی</label><input name="debt" type="number"></div><div class="field"><label>تاریخ شمسی</label><input name="date" value="${today()}"></div><div class="field"><label>توضیحات</label><textarea name="desc"></textarea></div></div><button class="btn">ثبت</button></form>`);document.getElementById('ff').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.finance.push({id:crypto.randomUUID(),sid:f.get('sid'),type:f.get('type'),amount:f.get('amount')||0,debt:f.get('debt')||0,date:f.get('date'),desc:f.get('desc')});save();closeModal();finance();toast('ثبت مالی انجام شد')}}
function roles(){document.getElementById('view').innerHTML=`<div class="card"><button class="btn" onclick="openRole()">+ افزودن مسئولیت</button></div><div class="card"><table class="table"><tr><th>مسئولیت</th><th>مسئول</th><th>عکس</th><th>زیرمجموعه</th><th>حذف</th></tr>${db.roles.map(r=>{let s=db.servants.find(x=>x.id===r.sid);return `<tr><td>${r.name}</td><td>${s?.name||'—'}</td><td>${s?.photo?`<img src="${s.photo}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`:'—'}</td><td><button class="btn light" onclick="toast('زیرمجموعه: '+${JSON.stringify(db.roles.filter(x=>x.parent===r.id).map(x=>x.name).join('، ')||'بدون زیرمجموعه')})">+</button></td><td><button class="btn red" onclick="del('roles','${r.id}')">حذف</button></td></tr>`}).join('')}</table></div>`}function openRole(){modal('افزودن مسئولیت',`<form id="rf"><div class="form"><div class="field req"><label>نام مسئولیت</label><input name="name"></div><div class="field"><label>مسئول از بانک خدام</label><select name="sid">${db.servants.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div></div><button class="btn">ثبت</button></form>`);document.getElementById('rf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.roles.push({id:crypto.randomUUID(),name:f.get('name'),sid:f.get('sid')});save();closeModal();roles()}}
function settings(){let bg=localStorage.getItem('khademBg')||'';document.getElementById('view').innerHTML=`<div class="card"><h3>تنظیمات سامانه</h3><div class="form"><div class="field"><label>نام سامانه</label><input id="appname" value="سامانه جامع خادمین مجموعة السیدة زینب سلام الله علیها"></div><div class="field"><label>تصویر پس‌زمینه</label><input id="bgfile" type="file" accept="image/*"></div></div><div class="settings-preview" style="${bg?'background-image:url('+bg+')':''}"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button><button class="btn light" onclick="clearBg()">حذف پس‌زمینه</button></div></div><div class="card"><h3>تنظیمات نمایش</h3><p>حالت شب و روز از دکمه بالای صفحه قابل تغییر است.</p><p>تمام تغییرات سامانه به‌صورت خودکار ذخیره می‌شوند.</p></div>`}
function saveSettings(){let file=document.getElementById('bgfile').files[0];localStorage.setItem('khademAppName',document.getElementById('appname').value);if(file){let r=new FileReader();r.onload=()=>{localStorage.setItem('khademBg',r.result);applySettings();toast('تنظیمات ذخیره شد')};r.readAsDataURL(file)}else{applySettings();toast('تنظیمات ذخیره شد')}}function clearBg(){localStorage.removeItem('khademBg');applySettings();settings();toast('پس‌زمینه حذف شد')}function applySettings(){let n=localStorage.getItem('khademAppName')||'سامانه جامع خادمین مجموعة السیدة زینب سلام الله علیها';document.title=n;document.querySelector('.brand-title').innerHTML=n.replace(' مجموعة','<br>مجموعة');let bg=localStorage.getItem('khademBg');document.body.style.backgroundImage=bg?`url(${bg})`:'';document.body.style.backgroundSize='cover';document.body.style.backgroundAttachment='fixed'}
function guide(){document.getElementById('view').innerHTML=`<div class="card"><h3>راهنمای سامانه</h3><p><b>بانک خدام:</b> فیلدهای ستاره‌دار اجباری‌اند؛ در صورت ناقص بودن، نام دقیق فیلدها نمایش داده می‌شود.</p><p><b>سوابق خدمت:</b> خدمت رسمی و شب جمعه جداگانه ثبت می‌شوند.</p><p><b>پایش خدمت شب جمعه:</b> آخرین شب جمعه هر خادم و تعداد روز گذشته را نشان می‌دهد.</p><p><b>جلسات:</b> برای هر خادم حاضر یا غایب انتخاب می‌شود و درصد حضور خودکار محاسبه می‌شود.</p><p><b>امور مالی:</b> پرداخت‌ها بر اساس شهریه، هیئت، صندوق و البسه/تجهیزات تفکیک می‌شوند.</p><p><b>ذخیره خودکار:</b> تغییرات پس از هر عملیات در حافظه محلی ذخیره می‌شود.</p></div>`}
function modal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function del(col,id){if(confirm('آیا حذف شود؟')){db[col]=db[col].filter(x=>x.id!==id);save();go(current);toast('حذف شد')}}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='پشتیبان-خادمین.json';a.click();toast('پشتیبان ایجاد شد')}applySettings();nav();go(current);if(dark)toggleDark();
</script></body></html>
