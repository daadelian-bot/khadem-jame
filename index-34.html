<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="سامانه جامع مدیریت خادمین مجموعه السيدة زينب سلام الله علیها">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مدیریت خادمین">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./logo.png" type="image/png">
  <link rel="apple-touch-icon" href="./logo.png">
  <title>سامانه جامع مدیریت خادمین</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f7f8fa; }
    body { margin: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; }
    #app { min-height: 100vh; }
    .boot-message { margin: 12vh auto 0; padding: 24px; max-width: 560px; text-align: center; color: #173f35; }
  </style>
</head>
<body>
  <div id="app"><main class="boot-message"><h1>سامانه جامع مدیریت خادمین</h1><p>در حال بارگذاری برنامه…</p><p>اگر این پیام باقی ماند، اتصال اینترنت و فایل app.js را بررسی کنید.</p></main></div>
  <noscript><p dir="rtl">برای اجرای سامانه، JavaScript مرورگر باید فعال باشد.</p></noscript>
  <script src="./app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
          .catch(function (error) { console.warn("ثبت سرویس‌ورکر ناموفق بود:", error); });
      });
    }
  </script>
</body>
</html>
