<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b58">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>سامانه جامع مدیریت خادمین | اتصال داده‌ها</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" as="image" href="./logo.png">
  <link id="kj-style" rel="stylesheet" href="./style.css?v=20261016-108">
  <style>
    html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f5f8;color:#1c3045}
    #app{min-height:100vh}
    .boot{max-width:520px;margin:12vh auto;padding:24px;background:#fff;border:1px solid #dfe6ed;border-bottom:3px solid #c6a66a;border-radius:18px;text-align:center;line-height:2}
    .boot h1{font-size:20px}
    .boot p{color:#65798a}
  
    #kj-update-widget{position:fixed;left:10px;bottom:10px;z-index:10000;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(320px,calc(100vw - 20px));font-family:Tahoma,Arial,sans-serif}
    #kj-update-check{border:1px solid #173b58;border-radius:10px;background:#173b58;color:#fff;padding:9px 12px;font-size:12px;font-weight:700;box-shadow:0 3px 12px #10283f26;cursor:pointer}
    #kj-update-check:disabled{opacity:.65;cursor:wait}
    #kj-release-notes{display:inline-block;text-decoration:none;border:1px solid #c6a66a;border-radius:10px;background:#fff;color:#173b58;padding:8px 11px;font-size:12px;font-weight:700;box-shadow:0 3px 12px #10283f18}
    #kj-update-status{background:#fff;color:#1c3045;border:1px solid #dfe6ed;border-radius:9px;padding:8px 10px;font-size:11px;line-height:1.8;box-shadow:0 3px 12px #10283f18}
    #kj-update-status[hidden]{display:none}
  </style>
</head>
<body>
  <div id="app">
    <main class="boot">
      <h1>سامانه جامع مدیریت خادمین</h1>
      <p>در حال آماده‌سازی ورود امن و اتصال به پایگاه داده…</p>
      <p>برای مشاهده اطلاعات، با حساب کاربری معتبر سامانه وارد شوید.</p>
    </main>
  </div>
  <aside id="kj-update-widget" aria-label="به‌روزرسانی سامانه">
    <button id="kj-update-check" type="button">بررسی به‌روزرسانی</button>
    <a id="kj-release-notes" href="./release-notes.html?v=20261017-2">گزارش کامل تغییرات نسخه</a>
    <span id="kj-update-status" role="status" aria-live="polite" hidden></span>
  </aside>
  <noscript><main class="boot"><h1>جاوااسکریپت غیرفعال است</h1><p>برای استفاده از سامانه، جاوااسکریپت مرورگر را فعال کنید.</p></main></noscript>
  <script src="./offline-store.js?v=20261016-108" defer></script>
  <script src="./app.js?v=20261017-11" defer onerror="document.getElementById(\'app\').innerHTML=\'<main class=\\\"boot\\\"><h1>بارگذاری سامانه ناموفق بود</h1><p>فایل برنامه بارگذاری نشد. اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p></main>\'"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
          console.warn("KJ: offline shell registration failed", error);
        });
      });
    }
  </script>

  <script>
    (function () {
      const button = document.getElementById("kj-update-check");
      const status = document.getElementById("kj-update-status");
      if (!button || !status || !("serviceWorker" in navigator)) {
        if (button) button.hidden = true;
        return;
      }

      let registration = null;
      let updateDetected = false;
      const controllerAtStart = navigator.serviceWorker.controller;

      function showStatus(message) {
        status.textContent = message;
        status.hidden = false;
      }

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!controllerAtStart) return;
        updateDetected = true;
        button.textContent = "اعمال نسخه جدید";
        showStatus("نسخه جدید آماده است. برای جلوگیری از ازدست‌رفتن اطلاعات، تغییرات ثبت‌نشده را ذخیره کنید و سپس «اعمال نسخه جدید» را بزنید.");
      });

      button.addEventListener("click", async function () {
        if (updateDetected) {
          window.location.reload();
          return;
        }

        button.disabled = true;
        showStatus("در حال بررسی نسخه جدید…");
        let timeoutId = null;
        try {
          registration = registration || await navigator.serviceWorker.getRegistration();
          if (!registration) {
            registration = await navigator.serviceWorker.register("./service-worker.js");
          }

          let newWorkerInstalled = false;
          const updateFound = new Promise(function (resolve) {
            const inspectWorker = function () {
              const worker = registration.installing;
              if (!worker) {
                resolve(false);
                return;
              }
              const onStateChange = function () {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  newWorkerInstalled = true;
                  resolve(true);
                } else if (worker.state === "redundant") {
                  resolve(false);
                }
              };
              worker.addEventListener("statechange", onStateChange);
            };
            registration.addEventListener("updatefound", inspectWorker, { once: true });
            timeoutId = window.setTimeout(function () { resolve(false); }, 7000);
          });

          await registration.update();
          const installed = await updateFound;
          if (timeoutId !== null) window.clearTimeout(timeoutId);

          if (updateDetected || installed || newWorkerInstalled || registration.waiting) {
            updateDetected = true;
            button.textContent = "اعمال نسخه جدید";
            showStatus("نسخه جدید دریافت شد. برای جلوگیری از ازدست‌رفتن اطلاعات، تغییرات ثبت‌نشده را ذخیره کنید و سپس «اعمال نسخه جدید» را بزنید.");
          } else {
            showStatus("نسخه جدیدی پیدا نشد. اگر نسخه‌ای همین الان منتشر شده، چند لحظه بعد دوباره بررسی کنید.");
          }
        } catch (error) {
          showStatus("بررسی به‌روزرسانی ناموفق بود؛ اتصال اینترنت را بررسی کنید.");
        } finally {
          if (timeoutId !== null) window.clearTimeout(timeoutId);
          button.disabled = false;
        }
      });
    })();
  </script>

</body>
</html>
