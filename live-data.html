  <style>
    html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f5f8;color:#1c3045}
    #app{min-height:100vh}
    .boot{max-width:520px;margin:12vh auto;padding:24px;background:#fff;border:1px solid #dfe6ed;border-bottom:3px solid #c6a66a;border-radius:18px;text-align:center;line-height:2}
    .boot h1{font-size:20px}
    .boot p{color:#65798a}
  
    #kj-update-widget{position:fixed;left:10px;bottom:10px;z-index:10000;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(320px,calc(100vw - 20px));font-family:Tahoma,Arial,sans-serif}
    #kj-release-notes,#kj-developer-console{display:inline-block;text-decoration:none;border:1px solid #c6a66a;border-radius:10px;background:#fff;color:#173b58;padding:8px 11px;font-size:12px;font-weight:700;box-shadow:0 3px 12px #10283f18}
    #kj-developer-console{display:none;text-decoration:none;border:1px solid #173b58;border-radius:10px;background:#fff;color:#173b58;padding:8px 11px;font-size:12px;font-weight:700;box-shadow:0 3px 12px #10283f18}
    #kj-developer-console.ready{display:inline-block}
  </style>
</head>
<body>
  <div id="app">
    <main class="boot">
      <h1>سامانه جامع مدیریت خادمین</h1>
      <p>در حال آماده‌سازی ورود امن و اتصال به پایگاه داده…</p>
      <p>برای مشاهده اطلاعات، با حساب کاربری معتبر سامانه وارد شوید.</p>
    </main>
  </div>
  <aside id="kj-update-widget" aria-label="پیوندهای سامانه">
    <a id="kj-release-notes" href="./release-notes.html?v=20261017-7">گزارش کامل تغییرات نسخه</a>
    <a id="kj-developer-console" href="./developer-console.html?v=20261017-3" hidden>توسعه هوشمند (مدیر اصلی)</a>
  </aside>
  <noscript><main class="boot"><h1>جاوااسکریپت غیرفعال است</h1><p>برای استفاده از سامانه، جاوااسکریپت مرورگر را فعال کنید.</p></main></noscript>
  <script src="./offline-store.js?v=20261017-14" defer></script>
  <script src="./app.js?v=20261017-16" defer onerror="document.getElementById(\'app\').innerHTML=\'<main class=\\\"boot\\\"><h1>بارگذاری سامانه ناموفق بود</h1><p>فایل برنامه بارگذاری نشد. اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p></main>\'"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
          console.warn("KJ: offline shell registration failed", error);
        });
      });
    }
  </script>

  <script>
    (function () {
      const link = document.getElementById("kj-developer-console");
      if (!link) return;
      function findToken() {
        try {
          const token = localStorage.getItem("kj_access_token");
          if (token) return token;
          const session = JSON.parse(localStorage.getItem("khadem_session") || "{}");
          return session.access_token || "";
        } catch (_) { return ""; }
      }
      async function checkAdmin() {
        const token = findToken();
        if (!token) return;
        try {
          const response = await fetch("https://fxxtyfurdzpzfvweoppo.supabase.co/functions/v1/submit-developer-request", {
            method: "POST",
            headers: {
              "apikey": "sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7",
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({ action: "check" }),
            cache: "no-store",
            credentials: "omit"
          });
          if (!response.ok) return;
          const result = await response.json();
          if (result && result.is_admin === true) {
            link.hidden = false;
            link.classList.add("ready");
          }
        } catch (_) {}
      }
      window.addEventListener("load", function () {
        window.setTimeout(checkAdmin, 1200);
      });
    })();
  </script>
</body>
</html>
