<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأیید ایمیل و تعیین رمز</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#18212f;font-family:Tahoma,Arial,sans-serif;line-height:1.9}main{max-width:560px;margin:30px auto;padding:16px}.panel{background:#fff;border:1px solid #d9e0e8;border-radius:18px;padding:22px}h1{font-size:1.3rem}p{color:#657084}label{display:block;font-weight:700;margin:12px 0 5px}input,button{width:100%;padding:12px;border:1px solid #d9e0e8;border-radius:10px;font:inherit}button{background:#175b45;color:white;border:0;font-weight:bold;margin-top:16px;cursor:pointer}.notice{padding:12px;background:#f1f5f8;border-radius:10px;white-space:pre-wrap}.error{background:#fff0f0;color:#9c2626}.ok{background:#eaf7ef;color:#155d35}.hidden{display:none!important}
</style></head><body><main><section class="panel">
<h1>تأیید ایمیل و تعیین رمز عبور</h1>
<p>اگر از طرف مدیر اصلی دعوت شده‌اید، از پیوند داخل ایمیل به این صفحه رسیده‌اید. یک رمز شخصی بسازید؛ رمز را برای هیچ‌کس ارسال نکنید.</p>
<div id="formBox" class="hidden"><label for="pw">رمز جدید (حداقل ۸ نویسه)</label><input id="pw" type="password" autocomplete="new-password" minlength="8"><label for="pw2">تکرار رمز جدید</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"><button id="save">ثبت رمز و ورود به سامانه</button></div>
<div id="message" class="notice" role="status" aria-live="polite">در حال بررسی پیوند دعوت…</div>
</section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://fxxtyfurdzpzfvweoppo.supabase.co","sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7",{auth:{detectSessionInUrl:true,flowType:"implicit",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);function show(t,k=""){$("message").textContent=t;$("message").className="notice "+k;}
async function ready(){const {data:{session},error}=await supabase.auth.getSession();if(error){show("خواندن نشست ناموفق بود. پیوند دعوت را دوباره از ایمیل باز کنید.","error");return;}if(session){$("formBox").classList.remove("hidden");show("نشست تأیید ایمیل دریافت شد. رمز شخصی خود را تعیین کنید.","ok");}else{show("پیوند معتبر یا فعال نیست. از مدیر اصلی بخواهید دعوت‌نامه تازه ارسال کند.","error");}}
$("save").addEventListener("click",async()=>{const p=$("pw").value,p2=$("pw2").value;if(p.length<8){show("رمز باید دست‌کم ۸ نویسه باشد.","error");return;}if(p!==p2){show("دو رمز یکسان نیستند.","error");return;}const b=$("save");b.disabled=true;b.textContent="در حال ثبت رمز…";const {error}=await supabase.auth.updateUser({password:p});b.disabled=false;b.textContent="ثبت رمز و ورود به سامانه";if(error){show("ثبت رمز ناموفق بود: "+error.message,"error");return;}show("رمز با موفقیت تعیین شد. در حال انتقال به سامانه…","ok");setTimeout(()=>location.replace("https://daadelian-bot.github.io/khadem-jame/"),1200);});
supabase.auth.onAuthStateChange((_event,session)=>{if(session){$("formBox").classList.remove("hidden");show("نشست تأیید ایمیل دریافت شد. رمز شخصی خود را تعیین کنید.","ok");}});
await ready();
</script></body></html>
