<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>تأیید ایمیل و تعیین رمز</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#1c3045;font-family:Tahoma,Arial,sans-serif;line-height:1.9}main{max-width:560px;margin:30px auto;padding:16px}.panel{background:#fff;border:1px solid #dfe6ed;border-radius:18px;padding:22px}h1{font-size:1.3rem}p{color:#65798a}label{display:block;font-weight:700;margin:12px 0 5px}input,button{width:100%;padding:12px;border:1px solid #dfe6ed;border-radius:10px;font:inherit}button{background:#173b58;color:white;border:0;font-weight:bold;margin-top:16px;cursor:pointer}.notice{padding:12px;background:#edf2f7;border-radius:10px;white-space:pre-wrap}.error{background:#fff0f0;color:#9c2626}.ok{background:#eaf7ef;color:#155d35}.hidden{display:none!important}
</style></head><body><main><section class="panel">
<h1>تأیید ایمیل و تعیین رمز عبور</h1>
<p>اگر از طرف مدیر اصلی دعوت شده‌اید، از پیوند داخل ایمیل به این صفحه رسیده‌اید. یک رمز شخصی بسازید؛ رمز را برای هیچ‌کس ارسال نکنید.</p>
<div id="formBox" class="hidden"><label for="pw">رمز جدید (حداقل ۸ نویسه)</label><input id="pw" type="password" autocomplete="new-password" minlength="8"><label for="pw2">تکرار رمز جدید</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"><button id="save">ثبت رمز و ورود به سامانه</button></div>
<div id="message" class="notice" role="status" aria-live="polite">در حال بررسی پیوند دعوت…</div>
</section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://fxxtyfurdzpzfvweoppo.supabase.co","sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7",{auth:{detectSessionInUrl:true,flowType:"implicit",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);function show(t,k=""){$("message").textContent=t;$("message").className="notice "+k;}
const initialHash=new URLSearchParams(location.hash.slice(1)), initialQuery=new URLSearchParams(location.search);
const initialType=initialHash.get("type")||initialQuery.get("type");
const hasEmailToken=!!(initialHash.get("access_token")||initialHash.get("token_hash")||initialQuery.get("code")) && ["invite","signup","recovery","magiclink","email",""].includes(initialType||"");
const linkError=initialHash.get("error_description")||initialQuery.get("error_description");
async function ready(){if(linkError){show("پیوند معتبر نیست یا منقضی شده است. از مدیر اصلی بخواهید دعوت‌نامه تازه ارسال کند.","error");return;}if(!hasEmailToken){show("پیوند پیدا نشد، قبلاً استفاده شده یا منقضی شده است. برای امنیت، نشست قدیمی به‌تنهایی برای پذیرش دعوت کافی نیست؛ لینک تازه درخواست کنید.","error");return;}const {data:{session},error}=await supabase.auth.getSession();if(error||!session){show("پیوند نامعتبر یا منقضی شده است. از مدیر اصلی بخواهید دعوت‌نامه تازه ارسال کند.","error");return;}$("formBox").classList.remove("hidden");show("پیوند تأیید شد. رمز شخصی خود را تعیین کنید؛ این پیوند پس از تأیید ایمیل یک‌بارمصرف است.","ok");history.replaceState(null,"",location.pathname);}
$("save").addEventListener("click",async()=>{const p=$("pw").value,p2=$("pw2").value;if(p.length<8){show("رمز باید دست‌کم ۸ نویسه داشته باشد.","error");return;}if(p!==p2){show("دو رمز یکسان نیستند.","error");return;}const b=$("save");b.disabled=true;b.textContent="در حال ثبت رمز…";try{const {data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError)throw new Error("نشست دعوت قابل خواندن نیست؛ پیوند دعوت را دوباره باز کنید.");if(!session?.access_token)throw new Error("نشست دعوت منقضی شده است؛ از مدیر اصلی بخواهید دعوت‌نامه تازه بفرستد.");const response=await fetch("https://fxxtyfurdzpzfvweoppo.supabase.co/functions/v1/update-own-password",{method:"POST",headers:{"apikey":"sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7","Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({password:p}),cache:"no-store",credentials:"omit"});const result=await response.json().catch(()=>({}));if(!response.ok||result.error)throw new Error(result.error||("ذخیره رمز ناموفق بود (HTTP "+response.status+")."));const user=result.user||session.user;localStorage.setItem("kj_access_token",session.access_token);localStorage.setItem("kj_user",JSON.stringify(user));localStorage.setItem("khadem_session",JSON.stringify({...session,user}));if(user?.email)localStorage.setItem("khadem_last_email",user.email);$("pw").value="";$("pw2").value="";$("save").disabled=true;history.replaceState(null,"",location.pathname);show("رمز با موفقیت ذخیره شد. پیوند ایمیل دیگر قابل استفاده نیست؛ در حال ورود به سامانه…","ok");setTimeout(()=>location.replace("https://daadelian-bot.github.io/khadem-jame/?authcheck="+Date.now()),700);}catch(error){show("ثبت رمز ناموفق بود: "+(error?.message||"ارتباط با سرویس برقرار نشد.")+" اگر مشکل ادامه داشت، پیوند دعوت را دوباره باز کنید یا با مدیر اصلی تماس بگیرید.","error");}finally{b.disabled=false;b.textContent="ثبت رمز و ورود به سامانه";}});
supabase.auth.onAuthStateChange((_event,session)=>{if(session){$("formBox").classList.remove("hidden");show("نشست تأیید ایمیل دریافت شد. رمز شخصی خود را تعیین کنید.","ok");}});
await ready();
</script></body></html>
