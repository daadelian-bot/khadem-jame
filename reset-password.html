<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4b2b1b">
<title>تغییر رمز عبور | سامانه جامع خادمین</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f8f3ec,#f0e5d8);color:#2c211b;font-family:Tahoma,Arial,sans-serif;line-height:1.9;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #eadfd5;border-radius:22px;padding:24px;box-shadow:0 14px 40px #3d25151a}h1{font-size:1.35rem;margin-top:0}p{color:#6b5a4e}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}input,button,a{width:100%;display:block;font:inherit;padding:12px 14px;border-radius:12px}input{border:1px solid #d8c8b8;background:#fff}button{border:0;background:#6b3f24;color:white;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.6;cursor:wait}.notice{padding:12px;border-radius:12px;background:#f8efe3;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#fff0f0;color:#9c2626}.ok{background:#eaf7ef;color:#155d35}.hidden{display:none!important}.link{margin-top:12px;text-align:center;color:#6b3f24}
</style>
</head>
<body><main class="card">
<h1>تغییر رمز عبور</h1>
<p>برای امنیت حساب، تغییر رمز فقط با پیوند معتبر بازیابی ارسال‌شده به ایمیل امکان‌پذیر است. رمز خود را برای هیچ‌کس نفرستید.</p>
<div id="message" class="notice" role="status" aria-live="polite">در حال بررسی پیوند بازیابی…</div>
<form id="form" class="hidden">
<div class="field"><label for="email">ایمیل حساب کاربری</label><input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="ایمیل دریافت‌کننده لینک بازیابی"></div>
<div class="field"><label for="pw">رمز جدید (حداقل ۸ نویسه)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label for="pw2">تکرار رمز جدید</label><input id="pw2" type="password" minlength="8" autocomplete="new-password" required></div>
<button id="save" type="submit">ذخیره رمز جدید</button>
</form>
<a class="link" href="https://daadelian-bot.github.io/khadem-jame/forgot-password.html">ارسال دوباره لینک بازیابی</a><a class="link" href="https://daadelian-bot.github.io/khadem-jame/">بازگشت به صفحه ورود</a>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://fxxtyfurdzpzfvweoppo.supabase.co","sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7",{auth:{detectSessionInUrl:true,flowType:"implicit",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
function show(text,kind=""){$("message").textContent=text;$("message").className="notice "+kind;}
let recoveryReady=false, recoveryEmail="";
async function check(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  const err=hash.get("error_description")||query.get("error_description");
  if(err){show("پیوند بازیابی معتبر نیست یا منقضی شده است: "+err,"error");return;}
  const type=hash.get("type")||query.get("type");
  const {data:{session},error}=await supabase.auth.getSession();
  if(error){show("بررسی پیوند ناموفق بود: "+error.message,"error");return;}
  if(session&&(type==="recovery"||location.hash.includes("access_token="))){
    recoveryReady=true;recoveryEmail=(session.user&&session.user.email)||"";
    $("email").value=recoveryEmail;
    $("form").classList.remove("hidden");
    show("پیوند بازیابی معتبر است. ایمیل حساب را بررسی کنید و رمز جدید را دو بار وارد کنید.","ok");return;
  }
  show("پیوند بازیابی در این صفحه شناسایی نشد یا منقضی شده است. از صفحه ورود، درخواست بازیابی تازه بفرستید و لینک ایمیل را باز کنید.","error");
}
supabase.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"&&session){
    recoveryReady=true;recoveryEmail=(session.user&&session.user.email)||"";
    $("email").value=recoveryEmail;$("form").classList.remove("hidden");
    show("پیوند بازیابی معتبر است. ایمیل حساب را بررسی کنید و رمز جدید را دو بار وارد کنید.","ok");
  }
});
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!recoveryReady){show("نشست بازیابی معتبر نیست؛ لطفاً لینک تازه درخواست کنید.","error");return;}
  const enteredEmail=$("email").value.trim().toLowerCase();
  if(!enteredEmail||enteredEmail!==recoveryEmail.toLowerCase()){show("ایمیل واردشده با حسابی که لینک بازیابی برای آن صادر شده مطابقت ندارد.","error");return;}
  const p=$("pw").value,p2=$("pw2").value;
  if(p.length<8){show("رمز باید دست‌کم ۸ نویسه باشد.","error");return;}
  if(p!==p2){show("دو رمز یکسان نیستند.","error");return;}
  const b=$("save");b.disabled=true;b.textContent="در حال ذخیره رمز…";
  const {error}=await supabase.auth.updateUser({password:p});
  b.disabled=false;b.textContent="ذخیره رمز جدید";
  if(error){show("تغییر رمز انجام نشد: "+error.message,"error");return;}
  $("pw").value="";$("pw2").value="";
  show("رمز عبور با موفقیت تغییر کرد. اکنون می‌توانید با رمز جدید وارد سامانه شوید.","ok");
  await supabase.auth.signOut();
  setTimeout(()=>location.replace("https://daadelian-bot.github.io/khadem-jame/"),1500);
});
await check();
</script></body></html>
