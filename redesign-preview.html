<style>
:root{--navy:#14243a;--navy2:#1c3452;--gold:#c9a66b;--paper:#f4f6f9;--card:#fff;--ink:#17263a;--muted:#6d7b8d;--line:#e3e8ef;--green:#20866b;--red:#b84a55;--blue:#386bb3;--radius:18px;--shadow:0 8px 28px #17263a0b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;line-height:1.8}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--navy),#2c4d73);color:var(--gold);display:grid;place-items:center;font-size:23px}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.search{width:min(320px,30vw);background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 13px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#edf7f2;color:#1a7659;font-size:11px;font-weight:700}.user{display:flex;align-items:center;gap:9px;border-right:1px solid var(--line);padding-right:14px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e7edf5;color:var(--navy);font-weight:800}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{background:var(--navy);color:#dce5f0;padding:18px 12px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.org{padding:14px 13px 20px;border-bottom:1px solid #ffffff1b;margin-bottom:12px}.org b{display:block;color:#fff;font-size:13px}.org small{color:#a9bbd0;font-size:11px}.nav-label{color:#8197b1;font-size:10px;font-weight:800;padding:13px 12px 5px}.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;margin:3px 0;color:#cbd7e5;font-size:12px;border:1px solid transparent;background:none;width:100%;text-align:right}.nav .ico{width:25px;text-align:c r-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 46px,#edf0f5 47px,#edf0f5 48px)}.barwrap{height:100%;flex:1;display:flex;align-items:end;justify-content:center;position:relative}.bar{width:min(30px,70%);border-radius:7px 7px 0 0;background:linear-gradient(180deg,#d8bb83,#b18b4d);min-height:8px}.bar.alt{background:linear-gradient(180deg,#8da7c7,#3d5e88)}.chartlabels{display:flex;justify-content:space-around;color:var(--muted);font-size:10px;padding-top:8px}.legend{display:flex;gap:16px;color:var(--muted);font-size:10px}.legend span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--gold);margin-left:5px}.legend .blue:before{background:#3d5e88}.ringrow{display:flex;align-items:center;gap:22px;padding:10px 4px}.ring{width:122px;height:122px;border-radius:50%;background:conic-gradient(var(--green) 0 78%,#e9edf2 78% 100%);display:grid;place-items:center;flex-shrink:0;position:relative}.ring:before{content:'';position:absolute;inset:12px;background:white;border-radius:50%}.ring strong{position:relative;font-size:23px}.keylist{flex:1;display:grid;gap:12px}.keyrow{display:flex;justify-content:space-between;gap:10px;font-size:11px}.keyrow span{color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:12px 13px;text-align:right;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:10px;color:#607087;background:#f7f9fb;font-weight:800}td{font-size:11px}tbody tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:9px}.miniavatar{width:31px;height:31px;border-radius:10px;background:#edf1f7;color:#405875;display:grid;place-items:center;font-weight:800}.status{border-radius:99px;padding:4px 9px;font-size:10px;font-weight:700;background:#e7f5ef;color:#1a7659}.status.warn{background:#fff2df;color:#966a20}.status.off{background:#faecee;color:#a63b48}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.quick button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;text-align:right;display:flex;align-items:center;gap:10px;font-weight:700;font-size:11px;color:var(--ink)}.quick button span:first-child{font-size:21px}.quick button:hover{border-color:var(--gold);transform:translateY(-1px)}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{padding:10px 14px;border:0;background:transparent;color:var(--muted);font-size:12px;border-bottom:2px solid transparent}.tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:800}.profilehero{display:flex;align-items:center;gap:15px;padding:20px;background:linear-gradient(110deg,#fff,#f7f9fc);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}.profilephoto{width:72px;height:72px;border-radius:22px;background:#e8edf4;display:grid;place-items:center;font-size:32px;color:var(--navy)}.profilehero h2{margin:0;font-size:19px}.profilemeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.meta{font-size:10px;color:var(--muted);background:#f0f3f7;border-radius:7px;padding:4px 8px}.detailgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.detail{padding:12px;border:1px solid var(--line);border-radius:12px}.detail small{display:block;color:var(--muted);font-size:10px}.detail b{display:block;margin-top:4px;font-size:12px;overflow-wrap:anywhere}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}.field.full{grid-column:1/-1}.modulelist{display:grid;gap:8px}.module{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:10px 12px;border-radius:12px}.module b{font-size:12px}.module small{display:block;color:var(--muted);font-size:10px}.switch{width:37px;height:21px;background:#cdd5df;border-radius:99px;border:0;padding:3px;flex-shrink:0}.switch:after{content:'';display:block;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(-16px)}.admincols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:12px 14px;border-radius:12px;background:#fff6e6;border-right:3px solid var(--gold);font-size:11px;color:#765723;margin-bottom:14px}.footer{text-align:center;color:#8996a7;font-size:10px;padding:28px 0 10px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:10}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.top{height:auto;min-height:68px;padding:10px 12px;gap:8px}.brand strong{font-size:12px}.brand small{font-size:9px}.logo{width:38px;height:38px}.search{display:none}.user .who{display:none}.layout{display:block}aside{position:fixed;top:68px;right:0;bottom:0;height:auto;width:260px;z-index:8;transform:translateX(105%);transition:transform .2s;box-shadow:-15px 0 40px #0002}aside.open{transform:translateX(0)}.main{padding:16px 12px}.pagehead h1{font-size:20px}.pagehead{align-items:flex-start}.pagehead .btn{padding:8px;font-size:10px}.stats{gap:9px}.card{padding:13px;border-radius:15px}.stat{gap:8px}.stat-icon{width:37px;height:37px;font-size:18px}.stat strong{font-size:21px}.stat small{font-size:10px}.grid2{gap:12px}.quick{gap:8px}.quick button{padding:10px 8px;font-size:10px}.detailgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.profilehero{padding:13px;gap:10px}.profilephoto{width:54px;height:54px;border-radius:16px;font-size:25px}.profilehero h2{font-size:16px}.admincols{grid-template-columns:1fr}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.ringrow{gap:12px}.ring{width:100px;height:100px}.ring:before{inset:10px}.top-actions{gap:6px}.top-actions .btn{padding:7px 9px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><button class="btn" id="menuToggle" aria-label="باز و بسته کردن منو">☰</button><div class="logo">✦</div><div><strong>سامانه جامع مدیریت خدام</strong><small>مجموعة السیدة زینب سلام الله علیها · بندر گناوه</small></div></div><div class="top-actions"><input class="search" id="globalSearch" placeholder="جست‌وجوی نام، کد خادم یا بخش…"><span class="pill">● پیش‌نمایش طراحی</span><div class="user"><div class="avatar">م</div><div class="who"><b>مدیر مجموعه</b><small style="display:block;color:var(--muted);font-size:10px">دسترسی نمایشی</small></div></div></div></header>
<div class="layout"><aside id="sidebar"><div class="org"><b>مجموعه خدام عتبات مقدسه</b><small>پنل مدیریت سازمانی · پیش‌نمایش</small></div><div class="nav-label">مدیریت و عملیات</div><button class="nav active" data-page="dashboard"><span class="ico">▦</span>داشبورد مدیریتی</button><button class="nav" data-page="khadems"><span class="ico">♙</span>مدیریت خدام</button><button class="nav" data-page="attendance"><span class="ico">◷</span>حضور و غیاب</button><button class="nav" data-page="services"><span class="ico">⌖</span>خدمات و اعزام‌ها</button><button class="nav" data-page="finance"><span class="ico">▤</span>امور مالی و صندوق</button><button class="nav" data-page="equipment"><span class="ico">◇</span>لباس و تجهیزات</button><button class="nav" data-page="admin"><span class="ico">⚙</span>مدیریت سامانه و تنظیمات</button><div class="nav-label">کنترل و گزارش</div><button class="nav" data-page="reports"><span class="ico">▥</span>گزارش‌ها و آمار</button><button class="nav" data-page="audit"><span class="ico">◉</span>سوابق تغییرات</button><div style="margin:18px 8px;padding:12px;border:1px solid #ffffff18;border-radius:12px;color:#aabbd0;font-size:10px">این محیط نمونه است؛ اطلاعات و عملیات آن به پایگاه داده واقعی متصل نیست.</div></aside>
<main class="main" id="main"></main></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pages={dashboard:"نمای کلی مجموعه",khadems:"بانک اطلاعاتی خدام",attendance:"حضور و غیاب",services:"خدمات و اعزام‌ها",finance:"امور مالی و صندوق",equipment:"لباس و تجهیزات",admin:"مدیریت سامانه و تنظیمات",reports:"گزارش‌ها و آمار",audit:"سوابق تغییرات"};
let page="dashboard",profileTab="identity";
const defaultConfig={modules:[["dashboard","داشبورد مدیریتی",true],["khadems","مدیریت خدام",true],["attendance","حضور و غیاب",true],["services","خدمات و اعزام‌ها",true],["finance","امور مالی و صندوق",true],["equipment","لباس و تجهیزات",true],["admin","مدیریت سامانه و تنظیمات",true],["reports","گزارش‌ها و آمار",true],["audit","سوابق تغییرات",true]],fields:[["tri_name","نام سه‌جزئی","text",true],["father_name","نام پدر","text",false],["national_id","کد ملی","text",false],["phone","شماره تماس","tel",true],["membership_date","تاریخ عضویت","date",false]],columns:[["khadem_code","کد خادم",true],["full_name","نام و نام خانوادگی",true],["phone","شماره تماس",true],["status","وضعیت",true]]};
function getConfig(){try{return Object.assign({},defaultConfig,JSON.parse(localStorage.getItem("khadem-design-config")||"{}"))}catch{return defaultConfig}}
let config=getConfig();
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2300)}
function head(title,desc,actions=""){return '<div class="pagehead"><div><div class="eyebrow">مرکز مدیریت و عملیات</div><h1>'+title+'</h1><div class="subtext">'+desc+'</div></div><div style="display:flex;gap:7px;flex-wrap:wrap">'+actions+'</div></div>'}
function stat(icon,label,num,delta,cls=""){return '<div class="card stat"><div class="stat-icon '+cls+'">'+icon+'</div><div><small>'+label+'</small><strong>'+num+'</strong><span class="delta">'+delta+'</span></div></div>'}
function dashboard(){return head("داشبورد مدیریتی","نمای لحظه‌ای وضعیت مجموعه · اعداد این صفحه صرفاً نمونه طراحی هستند",'<button class="btn" onclick="toast(\'این خروجی نمایشی است\')">خروجی گزارش</button><button class="btn primary" onclick="go(\'khadems\')">＋ ثبت خادم</button>')+
'<div class="stats">'+stat("♙","کل خدام","۳۸۴","↑ ۱۲ نفر در سال جاری")+stat("✓","خدام فعال","۳۴۱","۸۸٫۸٪ از کل خدام","green")+stat("◷","نرخ حضور جلسات","۸۲٪","↑ ۴٪ نسبت به دوره قبل","gold")+stat("▤","مانده بدهی‌ها","۱۲٫۴","میلیون تومان","red")+'</div>'+
'<div class="grid2"><section class="card"><div class="cardhead"><div><h2>روند فعالیت مجموعه</h2><small>مشارکت در برنامه‌ها · ۶ ماه اخیر</small></div><button class="btn small" onclick="go(\'reports\')">مشاهده گزارش</button></div><div class="legend"><span>خدمت رسمی</span><span class="blue">شب جمعه</span></div><div class="chart">'+[48,65,55,77,69,88,75,93,70,82,62,90].map((v,i)=>'<div class="barwrap"><div class="bar '+(i%2?'alt':'')+'" style="height:'+v+'%"></div></div>').join('')+'</div><div class="chartlabels"><span>فروردین</span><span>اردیبهشت</span><span>خرداد</span><span>تیر</span><span>مرداد</span><span>شهریور</span></div></section>'+
'<section class="card"><div class="cardhead"><div><h2>وضعیت حضور</h2><small>جلسات ثبت‌شده در دوره انتخابی</small></div><button class="btn small" onclick="go(\'attendance\')">جزئیات</button></div><div class="ringrow"><div class="ring"><strong>۷۸٪</strong></div><div class="keylist"><div class="keyrow"><span><i class="dot" style="background:var(--green)"></i>حاضر</span><b>۷۸٪</b></div><div class="keyrow"><span><i class="dot" style="background:#d7dee7"></i>غایب</span><b>۱۴٪</b></div><div class="keyrow"><span><i class="dot" style="background:var(--gold)"></i>باعذر</span><b>۸٪</b></div><div class="subtext">منبع پیشنهادی: سوابق حضور معتبر</div></div></div></section></div>'+
'<div class="quick"><button onclick="go(\'khadems\')"><span>♙</span>پرونده خدام</button><button onclick="go(\'attendance\')"><span>◷</span>ثبت حضور</button><button onclick="go(\'finance\')"><span>▤</span>ثبت تراکنش مالی</button><button onclick="go(\'admin\')"><span>⚙</span>تنظیمات بدون کدنویسی</button></div>'+
'<section class="card" style="margin-top:16px"><div class="cardhead"><div><h2>پیگیری‌های مهم</h2><small>نمونه نمایشی؛ در نسخه عملیاتی باید از داده‌های واقعی تولید شود</small></div><button class="btn small" onclick="go(\'reports\')">همه موارد</button></div><div class="tablewrap"><table><thead><tr><th>موضوع</th><th>بخش مسئول</th><th>موعد</th><th>وضعیت</th></tr></thead><tbody><tr><td>تکمیل پرونده‌های ناقص</td><td>امور اداری</td><td>۱۴۰۵/۰۸/۰۱</td><td><span class="status warn">در انتظار</span></td></tr><tr><td>تأیید رسیدهای مالی</td><td>امور مالی</td><td>۱۴۰۵/۰۷/۲۷</td><td><span class="status">در حال پیگیری</span></td></tr><tr><td>برنامه‌ریزی خدمت شب جمعه</td><td>واحد خدمات</td><td>۱۴۰۵/۰۷/۲۹</td><td><span class="status warn">نیازمند اقدام</span></td></tr></tbody></table></div></section>'}
function khadems(){return head("بانک اطلاعاتی خدام","جست‌وجو و دسترسی به پرونده یکپارچه افراد",'<button class="btn" onclick="toast(\'خروجی نمونه است\')">خروجی Excel</button><button class="btn primary" onclick="toast(\'فرم ثبت در نسخه عملیاتی متصل می‌شود\')">＋ ثبت خادم</button>')+'<div class="card"><div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px"><input id="khSearch" class="search" style="width:min(340px,100%)" placeholder="نام یا کد خادم را جست‌وجو کنید"><select class="btn"><option>همه وضعیت‌ها</option><option>فعال</option><option>غیرفعال</option></select><button class="btn" onclick="toast(\'فیلترها در نسخه عملیاتی متصل می‌شوند\')">فیلترهای بیشتر</button></div><div class="tablewrap"><table><thead><tr><th>خادم</th><th>کد خادم</th><th>شماره تماس</th><th>مسئولیت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="khRows"><tr><td><div class="person"><div class="miniavatar">ع</div><b>علی رضایی</b></div></td><td>۱۰۲۴</td><td>۰۹۱۷•••۴۲۱۰</td><td>امور فرهنگی</td><td><span class="status">فعال</span></td><td><button class="btn small" onclick="go(\'profile\')">پرونده</button></td></tr><tr><td><div class="person"><div class="miniavatar">م</div><b>محمد حسینی</b></div></td><td>۱۰۳۱</td><td>۰۹۱۷•••۸۱۲۲</td><td>خدمت رسمی</td><td><span class="status">فعال</span></td><td><button class="btn small" onclick="go(\'profile\')">پرونده</button></td></tr><tr><td><div class="person"><div class="miniavatar">ح</div><b>حسن موسوی</b></div></td><td>۱۰۴۰</td><td>۰۹۱۷•••۰۳۱۹</td><td>امور اداری</td><td><span class="status off">غیرفعال</span></td><td><button class="btn small" onclick="go(\'profile\')">پرونده</button></td></tr></tbody></table></div><div class="subtext" style="margin-top:12px">این نام‌ها و اعداد ساختگی‌اند و فقط برای نمایش طراحی هستند.</div></div>'}
function profile(){return head("پرونده جامع خادم","مشخصات فردی، سوابق و ارتباط اطلاعات در یک صفحه",'<button class="btn" onclick="go(\'khadems\')">بازگشت به فهرست</button><button class="btn primary" onclick="toast(\'ویرایش در نسخه عملیاتی به پایگاه داده متصل می‌شود\')">✎ ویرایش پرونده</button>')+'<div class="profilehero"><div class="profilephoto">♙</div><div style="flex:1"><h2>علی رضایی</h2><div class="profilemeta"><span class="meta">کد خادم: ۱۰۲۴</span><span class="meta">عضویت: ۱۴۰۱/۰۴/۱۲</span><span class="status">فعال</span></div></div><button class="btn small" onclick="toast(\'کارت شناسایی در برنامه اجرایی تولید می‌شود\')">کارت شناسایی</button></div><div class="tabs">'+[['identity','مشخصات فردی'],['service','سوابق خدمت'],['finance','امور مالی'],['attendance','حضور و غیاب'],['equipment','تجهیزات'],['history','تاریخچه']].map(([id,t])=>'<button class="tab '+(profileTab===id?'active':'')+'" onclick="profileTab=\''+id+'\';render()">'+t+'</button>').join('')+'</div><div class="card">'+(profileTab==='identity'?'<div class="detailgrid">'+[['نام و نام خانوادگی','علی رضایی'],['نام پدر','حسین'],['شماره تماس','۰۹۱۷•••۴۲۱۰'],['تاریخ تولد','۱۳۶۵/۰۶/۲۲'],['مسئولیت اصلی','امور فرهنگی'],['سطح تحصیلات','کارشناسی'],['مهارت‌ها','برنامه‌ریزی، آموزش'],['تماس اضطراری','با دسترسی محدود'],['آخرین ویرایش','۱۴۰۵/۰۷/۲۲']].map(([a,b])=>'<div class="detail"><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div>':profileTab==='service'?'<div class="notice">سوابق خدمت از رکوردهای معتبر به این پرونده متصل می‌شوند و دوباره ثبت نمی‌شوند.</div><div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>نوع برنامه</th><th>محل</th><th>وضعیت</th></tr></thead><tbody><tr><td>۱۴۰۵/۰۷/۱۷</td><td>خدمت رسمی</td><td>نمونه</td><td><span class="status">حاضر</span></td></tr></tbody></table></div>':profileTab==='finance'?'<div class="notice">نمایش سوابق مالی باید براساس مجوز واقعی کاربر کنترل شود.</div><div class="detailgrid">'+[['نوع','شهریه'],['مبلغ','۱٬۵۰۰٬۰۰۰ تومان'],['پرداخت‌شده','۱٬۰۰۰٬۰۰۰ تومان'],['مانده','۵۰۰٬۰۰۰ تومان'],['تاریخ','۱۴۰۵/۰۷/۲۰'],['وضعیت','بدهکار']].map(([a,b])=>'<div class="detail"><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div>':'<div class="notice">این تب در پیش‌نمایش، فقط جایگاه طراحی را نشان می‌دهد؛ داده واقعی بارگیری نمی‌شود.</div>')+'</div>'}
function admin(){return head("مدیریت سامانه","کنترل منوها، فیلدها، ستون‌ها و ظاهر بدون ویرایش کد",'<button class="btn" onclick="resetConfig()">بازنشانی نمونه</button><button class="btn primary" onclick="saveConfig()">ذخیره تنظیمات نمونه</button>')+'<div class="notice"><b>مرز مهم:</b> این پیش‌نمایش تنظیمات را فقط در حافظه مرورگر همین دستگاه نگه می‌دارد. برای نسخه عملیاتی باید تنظیمات در پایگاه داده ذخیره شوند و دسترسی مدیر اصلی در سمت سرور کنترل شود. تغییر نام/فیلد نمایشی با تغییر منطق کسب‌وکار یا ساختار دیتابیس یکسان نیست.</div><div class="admincols"><section class="card"><div class="cardhead"><div><h2>ماژول‌ها و منوها</h2><small>فعال‌سازی، عنوان و ترتیب نمایش</small></div><span class="pill">قابل تنظیم</span></div><div class="modulelist">'+config.modules.map((m,i)=>'<div class="module"><div><b>'+m[1]+'</b><small>'+m[0]+'</small></div><div style="display:flex;gap:7px;align-items:center"><button class="btn small" onclick="renameModule('+i+')">ویرایش عنوان</button><button class="switch '+(m[2]?'on':'')+'" aria-label="تغییر وضعیت" onclick="toggleModule('+i+')"></button></div></div>').join('')+'</div><div class="fieldgrid" style="margin-top:14px"><div class="field"><label>عنوان منوی جدید</label><input id="newModule" placeholder="مثلاً امور فرهنگی"></div><div class="field" style="align-self:end"><button class="btn" onclick="addModule()">＋ افزودن منو</button></div></div></section><section class="card"><div class="cardhead"><div><h2>فیلدهای پرونده خادم</h2><small>عنوان، نوع و اجباری بودن</small></div><span class="pill">فرم‌ساز</span></div><div class="modulelist">'+config.fields.map((f,i)=>'<div class="module"><div><b>'+f[1]+'</b><small>'+f[0]+' · '+f[2]+'</small></div><div style="display:flex;gap:6px;align-items:center"><button class="btn small" onclick="renameField('+i+')">ویرایش</button><button class="switch '+(f[3]?'on':'')+'" onclick="toggleField('+i+')" aria-label="تغییر اجباری بودن"></button></div></div>').join('')+'</div><div class="fieldgrid" style="margin-top:14px"><div class="field"><label>شناسه فیلد</label><input id="newFieldKey" placeholder="مثلاً education_level"></div><div class="field"><label>عنوان فارسی</label><input id="newFieldLabel" placeholder="سطح تحصیلات"></div><div class="field"><label>نوع فیلد</label><select id="newFieldType"><option value="text">متن</option><option value="number">عدد</option><option value="date">تاریخ</option><option value="select">فهرست انتخابی</option><option value="textarea">متن بلند</option><option value="checkbox">بله/خیر</option></select></div><div class="field" style="align-self:end"><button class="btn" onclick="addField()">＋ افزودن فیلد</button></div></div></section></div><section class="card" style="margin-top:16px"><div class="cardhead"><div><h2>ستون‌های جدول خدام</h2><small>انتخاب ستون‌های نمایشی</small></div></div><div class="modulelist">'+config.columns.map((c,i)=>'<div class="module"><div><b>'+c[1]+'</b><small>'+c[0]+'</small></div><button class="switch '+(c[2]?'on':'')+'" onclick="toggleColumn('+i+')"></button></div>').join('')+'</div></section><section class="card" style="margin-top:16px"><div class="cardhead"><div><h2>راهنمای دامنه تنظیمات</h2><small>برای جلوگیری از ادعای «بدون کدنویسی» غیرواقعی</small></div></div><div class="detailgrid"><div class="detail"><small>بدون کدنویسی</small><b>عنوان‌ها، ترتیب و نمایش منوها، ستون‌ها، فیلدهای پشتیبانی‌شده، مقادیر انتخابی و قالب ظاهری</b></div><div class="detail"><small>نیازمند اتصال و مجوز سمت سرور</small><b>ذخیره مرکزی تنظیمات، نقش‌ها، دسترسی هر بخش و اعمال محدودیت بر داده‌ها</b></div><div class="detail"><small>ممکن است نیازمند توسعه</small><b>قواعد مالی جدید، گردش‌کار پیچیده، جدول/رابطه جدید و محاسبات تخصصی</b></div></div></section>'}
function generic(key){return head(pages[key]||"بخش سامانه","نمونه ساختار یکپارچه؛ اتصال به داده‌های واقعی در مرحله پیاده‌سازی")+'<div class="stats">'+stat("✓","وضعیت سامانه","آماده طراحی","داده نمایشی") + stat("◷","نیازمند بررسی","—","منبع واقعی تعیین می‌شود","gold")+stat("▤","گزارش‌های مرتبط","—","پس از اتصال داده") + stat("⚙","تنظیمات","مرکزی","قابل مدیریت")+'</div><section class="card" style="margin-top:16px"><div class="notice">این صفحه، ساختار بصری را نشان می‌دهد. هیچ عملیات واقعی یا تغییری در پایگاه داده انجام نمی‌شود.</div><button class="btn primary" onclick="go(\'admin\')">مدیریت تنظیمات این بخش</button></section>'}
function render(){const key=page==='profile'?'khadems':page;$("#main").innerHTML=page==='dashboard'?dashboard():page==='khadems'?khadems():page==='profile'?profile():page==='admin'?admin():generic(key);$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page||(page==='profile'&&n.dataset.page==='khadems')));if($('#khSearch'))$('#khSearch').addEventListener('input',e=>$$('#khRows tr').forEach(tr=>tr.style.display=tr.textContent.includes(e.target.value)?'':'none'))}
function go(p){page=p;render();if(innerWidth<760)$('#sidebar').classList.remove('open')}
function saveConfig(){localStorage.setItem('khadem-design-config',JSON.stringify(config));toast('تنظیمات نمونه فقط در همین مرورگر ذخیره شد.')}
function resetConfig(){if(!confirm('تنظیمات نمونه بازنشانی شود؟'))return;localStorage.removeItem('khadem-design-config');config=getConfig();render()}
function toggleModule(i){config.modules[i][2]=!config.modules[i][2];render()}
function renameModule(i){const v=prompt('عنوان جدید منو',config.modules[i][1]);if(v&&v.trim()){config.modules[i][1]=v.trim();render()}}
function addModule(){const v=$('#newModule')?.value.trim();if(!v)return toast('عنوان منو را وارد کنید');config.modules.push(['custom_'+Date.now(),v,true]);render()}
function renameField(i){const v=prompt('عنوان فارسی فیلد',config.fields[i][1]);if(v&&v.trim()){config.fields[i][1]=v.trim();render()}}
function toggleField(i){config.fields[i][3]=!config.fields[i][3];render()}
function addField(){const key=$('#newFieldKey').value.trim(),label=$('#newFieldLabel').value.trim(),type=$('#newFieldType').value;if(!/^[a-z][a-z0-9_]{1,60}$/.test(key)||!label)return toast('شناسه انگلیسی معتبر و عنوان فارسی را وارد کنید');if(config.fields.some(f=>f[0]===key))return toast('شناسه فیلد تکراری است');config.fields.push([key,label,type,false]);render()}
function toggleColumn(i){config.columns[i][2]=!config.columns[i][2];render()}
$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$$('.nav').forEach(n=>n.addEventListener('click',()=>go(n.dataset.page)));
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){go('khadems');setTimeout(()=>$('#khSearch')?.focus(),0)}});
render();
</script></body></html>
