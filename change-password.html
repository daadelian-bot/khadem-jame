<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#781f32">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>تغییر رمز عبور | سامانه جامع مدیریت خادمین</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f3f0;color:#292522;font-family:Tahoma,Arial,sans-serif;line-height:1.9;display:grid;place-items:center;padding:18px}.panel{width:min(560px,100%);background:#fff;border:1px solid #e8e1d9;border-radius:20px;padding:24px;box-shadow:0 12px 36px #34251b12}h1{font-size:1.35rem;margin:0 0 8px;color:#781f32}p{color:#77716b}.field{margin:14px 0}label{display:block;font-weight:700;margin:0 0 6px}input,button,a{font:inherit;border-radius:11px}input{width:100%;padding:12px;border:1px solid #d8d1ca;background:#fff}input:focus{outline:3px solid #781f3220;border-color:#781f32}button{width:100%;padding:12px;border:0;background:#781f32;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.6;cursor:wait}.notice{padding:12px;background:#f4f0ec;border-radius:11px;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#fff0f0;color:#9c2626}.ok{background:#eaf7ef;color:#155d35}.link{display:block;margin-top:12px;text-align:center;color:#781f32;text-decoration:none}.hidden{display:none!important}
</style></head>
<body><main class="panel">
<h1>تغییر رمز عبور</h1>
<p>برای امنیت حساب، رمز جدید را حداقل با ۸ نویسه انتخاب کنید. این صفحه از نشست ورود فعلی سامانه استفاده می‌کند.</p>
<div id="message" class="notice" role="status" aria-live="polite">در حال بررسی نشست ورود…</div>
<form id="form" class="hidden">
<div class="field"><label for="pw">رمز عبور جدید</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field"><label for="pw2">تکرار رمز عبور جدید</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
<button id="save" type="submit">ذخیره رمز جدید</button>
</form>
<a class="link" href="./forgot-password.html">رمز را فراموش کرده‌اید؟ بازیابی از طریق ایمیل</a>
<a class="link" href="./live-data.html">بازگشت به سامانه</a>
</main>
<script>
const SUPABASE_URL="https://fxxtyfurdzpzfvweoppo.supabase.co";
const SUPABASE_KEY="sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7";
const $=id=>document.getElementById(id);
const token=()=>{try{return localStorage.getItem("kj_access_token")||""}catch(_){return ""}};
function show(text,kind=""){$("message").textContent=text;$("message").className="notice "+kind;}
const accessToken=token();
if(!accessToken){show("نشست ورود پیدا نشد. ابتدا وارد سامانه شوید و سپس از منوی بالای صفحه «تغییر رمز عبور» را انتخاب کنید.","error");}
else{ $("form").classList.remove("hidden"); show("نشست ورود پیدا شد. رمز جدید را وارد کنید.","ok"); }
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const p=$("pw").value,p2=$("pw2").value;
 if(p.length<8){show("رمز باید دست‌کم ۸ نویسه باشد.","error");return;}
 if(p!==p2){show("دو رمز یکسان نیستند.","error");return;}
 const currentToken=token();
 if(!currentToken){show("نشست ورود منقضی شده است. دوباره وارد سامانه شوید.","error");return;}
 const b=$("save");b.disabled=true;b.textContent="در حال ذخیره…";
 try{
  const response=await fetch(SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+currentToken,"Content-Type":"application/json"},body:JSON.stringify({password:p}),cache:"no-store"});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){show("تغییر رمز انجام نشد: "+(data.message||data.msg||data.error_description||"خطای احراز هویت یا اعتبارسنجی درخواست"),"error");return;}
  $("pw").value="";$("pw2").value="";show("رمز عبور با موفقیت تغییر کرد.","ok");
 }catch(err){show("ارتباط با سرویس احراز هویت برقرار نشد. اینترنت را بررسی کنید و دوباره تلاش کنید.","error");}
 finally{b.disabled=false;b.textContent="ذخیره رمز جدید";}
});
</script></body></html>
