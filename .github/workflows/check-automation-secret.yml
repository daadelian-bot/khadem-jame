name: Check automation secret configuration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-automation-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    name: Verify GitHub secret is configured (without exposing it)
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -n "$GH_AUTOMATION_TOKEN" ]; then
            echo "GH_AUTOMATION_TOKEN is present."
          else
            echo "::error::GH_AUTOMATION_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
