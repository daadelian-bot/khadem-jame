name: Validate client-side JavaScript and app metadata

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "live-data.html"
      - "style.css"
      - "app.js"
      - "service-worker.js"
      - "offline-store.js"
      - "equipment-finance.js"
      - "manifest.webmanifest"
      - "admin-users.html"
      - "developer-console.html"
      - ".github/workflows/validate-inline-js.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-syntax:
    name: Check client-side scripts and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse every inline JavaScript block in index.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const scriptTag = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'khadem-inline-js-'));
          let match;
          let checked = 0;
          let failed = 0;

          while ((match = scriptTag.exec(html)) !== null) {
            const attrs = match[1] || '';
            const source = (match[2] || '').trim();
            if (!source || /\bsrc\s*=/i.test(attrs)) continue;

            const typeMatch = attrs.match(/\btype\s*=\s*["']([^"']+)["']/i);
            const type = typeMatch ? typeMatch[1].toLowerCase() : 'text/javascript';
            if (type.includes('json') || type === 'importmap') continue;
            if (!type.includes('javascript') && type !== 'module' && type !== 'text/ecmascript') continue;

            checked += 1;
            const file = path.join(tempDir, 'inline-' + checked + '.js');
            fs.writeFileSync(file, source, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed += 1;
              console.error('FAILED: inline script #' + checked);
              if (result.stdout) console.error(result.stdout);
              if (result.stderr) console.error(result.stderr);
            }
          }

          console.log('Checked ' + checked + ' inline JavaScript block(s); failures: ' + failed + '.');
          if (checked === 0) {
            console.error('No inline JavaScript blocks were found; refusing a false-green result.');
            process.exitCode = 1;
          } else if (failed > 0) {
            process.exitCode = 1;
          }
          NODE
      - name: Parse inline JavaScript in live-data.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('live-data.html', 'utf8');
          const scriptTag = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'khadem-live-data-inline-js-'));
          let match;
          let checked = 0;
          let failed = 0;

          while ((match = scriptTag.exec(html)) !== null) {
            const attrs = match[1] || '';
            const source = (match[2] || '').trim();
            if (!source || /\bsrc\s*=/i.test(attrs)) continue;

            const typeMatch = attrs.match(/\btype\s*=\s*["']([^"']+)["']/i);
            const type = typeMatch ? typeMatch[1].toLowerCase() : 'text/javascript';
            if (type.includes('json') || type === 'importmap') continue;
            if (!type.includes('javascript') && type !== 'module' && type !== 'text/ecmascript') continue;

            checked += 1;
            const file = path.join(tempDir, 'inline-' + checked + '.js');
            fs.writeFileSync(file, source, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed += 1;
              console.error('FAILED: live-data inline script #' + checked);
              if (result.stdout) console.error(result.stdout);
              if (result.stderr) console.error(result.stderr);
            }
          }

          console.log('Checked ' + checked + ' inline JavaScript block(s); failures: ' + failed + '.');
          if (checked === 0) {
            console.error('No inline JavaScript blocks were found in live-data.html; refusing a false-green result.');
            process.exitCode = 1;
          } else if (failed > 0) {
            process.exitCode = 1;
          }
          NODE
      - name: Parse inline JavaScript in developer-console.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('developer-console.html', 'utf8');
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'khadem-developer-inline-js-'));
          let match, checked = 0, failed = 0;
          while ((match = re.exec(html)) !== null) {
            const attrs = match[1] || '';
            const code = (match[2] || '').trim();
            if (!code || /\bsrc\s*=/.test(attrs)) continue;
            checked++;
            const file = path.join(dir, 'developer-inline-' + checked + '.mjs');
            fs.writeFileSync(file, code, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed++;
              console.error('FAILED: developer-console.html inline script #' + checked);
              console.error(result.stderr || result.stdout || 'Syntax check failed.');
            }
          }
          console.log('Checked ' + checked + ' developer-console inline script(s); failures: ' + failed + '.');
          if (checked === 0 || failed > 0) process.exitCode = 1;
          NODE
      - name: Parse inline JavaScript in admin-users.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('admin-users.html', 'utf8');
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'khadem-admin-inline-js-'));
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let match, checked = 0, failed = 0;
          while ((match = re.exec(html)) !== null) {
            const attrs = match[1] || '';
            const code = (match[2] || '').trim();
            if (!code || /\bsrc\s*=/.test(attrs)) continue;
            checked++;
            const file = path.join(tempDir, 'admin-inline-' + checked + '.mjs');
            fs.writeFileSync(file, code, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              failed++;
              console.error('FAILED: admin-users.html inline script #' + checked);
              console.error(result.stderr || result.stdout || 'Syntax check failed.');
            }
          }
          console.log('Checked ' + checked + ' admin-users inline script(s); failures: ' + failed + '.');
          if (checked === 0 || failed > 0) process.exitCode = 1;
          NODE
      - name: Check standalone JavaScript files
        run: |
          node --check app.js
          node --check service-worker.js
          node --check offline-store.js
          node --check equipment-finance.js
      - name: Validate web app manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('manifest.webmanifest is valid JSON.');"
