name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "logo.png"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required source and tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s index.html || { echo "::error::فایل index.html در ریشه مخزن وجود ندارد یا خالی است."; exit 1; }
          command -v curl
          command -v unzip
          command -v sha256sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -Eeuo pipefail
          GRADLE_VERSION="8.9"
          GRADLE_HOME="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"

          if [[ ! -x "${GRADLE_HOME}/bin/gradle" ]]; then
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              --output "${GRADLE_ZIP}"
            unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          fi

          test -x "${GRADLE_HOME}/bin/gradle"
          echo "${GRADLE_HOME}/bin" >> "${GITHUB_PATH}"
          "${GRADLE_HOME}/bin/gradle" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android WebView project
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_DIR="android-app"
          JAVA_DIR="${APP_DIR}/app/src/main/java/ir/sayedazainab/khademjame"
          mkdir -p "${JAVA_DIR}" "${APP_DIR}/app/src/main" "${APP_DIR}/app/src/main/assets"

          # Bundle the current web interface so the app shell opens without network access.
          # Form data sync is not claimed until the application-level queue is implemented.
          cp index.html service-worker.js manifest.webmanifest logo.png app.js styles.css "${APP_DIR}/app/src/main/assets/"

          cat > "${APP_DIR}/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SamaneJameKhademin"
          include(":app")
          EOF

          cat > "${APP_DIR}/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > "${APP_DIR}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

          cat > "${APP_DIR}/app/build.gradle" <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "ir.sayedazainab.khademjame"
              compileSdk 35

              defaultConfig {
                  applicationId "ir.sayedazainab.khademjame"
                  minSdk 23
                  targetSdk 28
                  versionCode 106
                  versionName "1.0.6"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              dependencies {
                  implementation "androidx.webkit:webkit:1.12.1"
              }
          }
          EOF

          cat > "${APP_DIR}/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="سامانه جامع خادمین"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "${JAVA_DIR}/MainActivity.java" <<'EOF'
          package ir.sayedazainab.khademjame;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewAssetLoader assetLoader;
              private static final String APP_URL =
                  "https://appassets.androidplatform.net/assets/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setSupportZoom(true);
                  webView.setWebViewClient(new WebViewClientCompat() {
                      @Override
                      public android.webkit.WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          String host = request.getUrl().getHost();
                          String scheme = request.getUrl().getScheme();
                          if ("appassets.androidplatform.net".equalsIgnoreCase(host)) return false;
                          return !("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme));
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(APP_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          test -s "${APP_DIR}/settings.gradle"
          test -s "${APP_DIR}/app/build.gradle"
          test -s "${APP_DIR}/app/src/main/AndroidManifest.xml"
          test -s "${JAVA_DIR}/MainActivity.java"

      - name: Build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle -p android-app --no-daemon --stacktrace clean assembleDebug

          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK_PATH}"

          mkdir -p dist
          cp "${APK_PATH}" "dist/Samane-Jame-Khademin-1.0.6-debug.apk"
          sha256sum "dist/Samane-Jame-Khademin-1.0.6-debug.apk" > "dist/SHA256SUMS.txt"

          cat > "dist/README-FA.txt" <<'EOF'
          سامانه جامع خادمین — بسته آزمایشی اندروید
          نسخه: 1.0.6 (کد نسخه 106)
          نوع ساخت: Debug APK

          این APK نسخه‌ای آزمایشی از پوسته WebView است. فایل‌های رابط کاربری فعلی (HTML، CSS، JS، لوگو و Service Worker)
          داخل APK بسته‌بندی می‌شوند تا خود رابط در شروع برنامه به اینترنت وابسته نباشد.
          ثبت/ویرایش داده‌ها و همگام‌سازی صف آفلاین با Supabase هنوز پیاده‌سازی نشده است و عملیات داده‌ای
          در این نسخه برای ذخیره در پایگاه داده به اتصال اینترنت نیاز دارد. این APK امضای انتشار رسمی ندارد.

          نصب:
          1) فایل APK را به گوشی اندرویدی منتقل کنید.
          2) فایل را باز کنید و در صورت درخواست، اجازه نصب از این منبع را فعال کنید.
          3) این نسخه آزمایشی است و APK انتشار نهایی با امضای رسمی نیست.
          EOF

          test -s "dist/SHA256SUMS.txt"
          test -s "dist/README-FA.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samane-Jame-Khademin-APK-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
