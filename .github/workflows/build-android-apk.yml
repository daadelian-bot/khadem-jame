name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "live-data.html"
      - "app.js"
      - "style.css"
      - "styles.css"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "logo.png"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required source and tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s index.html || { echo "::error::فایل index.html در ریشه مخزن وجود ندارد یا خالی است."; exit 1; }
          command -v curl
          command -v unzip
          command -v sha256sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -Eeuo pipefail
          GRADLE_VERSION="8.9"
          GRADLE_HOME="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}"
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"

          if [[ ! -x "${GRADLE_HOME}/bin/gradle" ]]; then
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              --output "${GRADLE_ZIP}"
            unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          fi

          test -x "${GRADLE_HOME}/bin/gradle"
          echo "${GRADLE_HOME}/bin" >> "${GITHUB_PATH}"
          "${GRADLE_HOME}/bin/gradle" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android WebView project
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_DIR="android-app"
          JAVA_DIR="${APP_DIR}/app/src/main/java/ir/sayedazainab/khademjame"
          mkdir -p "${JAVA_DIR}" "${APP_DIR}/app/src/main"

          cat > "${APP_DIR}/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SamaneJameKhademin"
          include(":app")
          EOF

          cat > "${APP_DIR}/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > "${APP_DIR}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

          cat > "${APP_DIR}/app/build.gradle" <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "ir.sayedazainab.khademjame"
              compileSdk 35

              defaultConfig {
                  applicationId "ir.sayedazainab.khademjame"
                  minSdk 23
                  targetSdk 28
                  versionCode 109
                  versionName "1.0.9"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "${APP_DIR}/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="سامانه جامع خادمین"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "${JAVA_DIR}/MainActivity.java" <<'EOF'
          package ir.sayedazainab.khademjame;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_URL =
                  "https://daadelian-bot.github.io/khadem-jame/live-data.html?v=20261017-18";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setSupportZoom(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          String scheme = request.getUrl().getScheme();
                          return !("https".equalsIgnoreCase(scheme)
                              || "http".equalsIgnoreCase(scheme));
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState);
                  } else {
                      webView.loadUrl(APP_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          test -s "${APP_DIR}/settings.gradle"
          test -s "${APP_DIR}/app/build.gradle"
          test -s "${APP_DIR}/app/src/main/AndroidManifest.xml"
          test -s "${JAVA_DIR}/MainActivity.java"

      - name: Generate Android launcher icons from current logo
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s logo.png || { echo "::error::لوگوی ریشه مخزن (logo.png) پیدا نشد."; exit 1; }
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open("logo.png").convert("RGBA")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              out = Image.new("RGBA", (size, size), (23, 59, 88, 255))
              logo = src.copy()
              logo.thumbnail((int(size*.78), int(size*.78)), Image.Resampling.LANCZOS)
              out.alpha_composite(logo, ((size-logo.width)//2, (size-logo.height)//2))
              dest = Path("android-app/app/src/main/res") / f"mipmap-{density}" / "ic_launcher.png"
              dest.parent.mkdir(parents=True, exist_ok=True)
              out.save(dest, format="PNG", optimize=True)
          out = Image.new("RGBA", (512, 512), (23, 59, 88, 255))
          logo = src.copy()
          logo.thumbnail((400, 400), Image.Resampling.LANCZOS)
          out.alpha_composite(logo, ((512-logo.width)//2, (512-logo.height)//2))
          out.save("android-app/launcher-icon-preview.png", format="PNG", optimize=True)
          print("Launcher icon assets generated from logo.png")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle -p android-app --no-daemon --stacktrace clean assembleDebug

          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK_PATH}"

          mkdir -p dist
          cp "${APK_PATH}" "dist/Samane-Jame-Khademin-1.0.9-debug.apk"

          cat > "dist/README-FA.txt" <<'EOF'
          سامانه جامع خادمین — بسته آزمایشی اندروید
          نسخه: 1.0.9 (کد نسخه 109)
          نوع ساخت: Debug APK

          این برنامه یک پوسته WebView است و نسخه منتشرشده سامانه را از اینترنت باز می‌کند.
          برای استفاده، اتصال اینترنت لازم است. تغییرات منتشرشده در GitHub Pages در اجرای برنامه
          نمایش داده می‌شوند؛ فایل‌های سایت داخل APK به‌صورت آفلاین بسته‌بندی نشده‌اند.

          نصب:
          1) فایل APK را به گوشی اندرویدی منتقل کنید.
          2) فایل را باز کنید و در صورت درخواست، اجازه نصب از این منبع را فعال کنید.
          3) این نسخه آزمایشی است و APK انتشار نهایی با امضای رسمی نیست.
          EOF

          test -s "dist/README-FA.txt"
          (cd dist && zip -q "Samane-Jame-Khademin-1.0.9.zip" "Samane-Jame-Khademin-1.0.9-debug.apk" "README-FA.txt")
          sha256sum dist/Samane-Jame-Khademin-1.0.9-debug.apk dist/Samane-Jame-Khademin-1.0.9.zip > dist/SHA256SUMS.txt
          test -s "dist/SHA256SUMS.txt"
          test -s "dist/Samane-Jame-Khademin-1.0.9.zip"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samane-Jame-Khademin-APK-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
