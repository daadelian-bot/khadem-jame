<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b58">
<title>فراموشی رمز عبور | سامانه جامع خادمین</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e5edf4,#edf2f7);color:#1c3045;font-family:Tahoma,Arial,sans-serif;line-height:1.9;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe6ed;border-radius:22px;padding:24px;box-shadow:0 14px 40px #10283f1a}h1{font-size:1.35rem;margin-top:0}p{color:#65798a}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}input,button,a{width:100%;display:block;font:inherit;padding:12px 14px;border-radius:12px}input{border:1px solid #d9e2eb;background:#fff}button{border:0;background:#245975;color:white;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.6;cursor:wait}.notice{padding:12px;border-radius:12px;background:#f3f5f8;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#fff0f0;color:#9c2626}.ok{background:#eaf7ef;color:#155d35}.link{margin-top:12px;text-align:center;color:#245975}
</style>
</head>
<body><main class="card">
<h1>بازیابی رمز عبور</h1>
<p>ایمیل حساب کاربری خود را وارد کنید. اگر برای این ایمیل حسابی وجود داشته باشد، لینک امن بازیابی ارسال می‌شود. لینک، صفحه اختصاصی تعیین رمز جدید را باز خواهد کرد.</p>
<div id="message" class="notice" role="status" aria-live="polite">آماده ارسال درخواست بازیابی هستید.</div>
<form id="form">
<div class="field"><label for="email">ایمیل حساب کاربری</label><input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="name@example.com"></div>
<button id="send" type="submit">ارسال لینک بازیابی</button>
</form>
<a class="link" href="https://daadelian-bot.github.io/khadem-jame/">بازگشت به صفحه اصلی سامانه</a>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://fxxtyfurdzpzfvweoppo.supabase.co","sb_publishable_HA3Z2cmNMddMTmpFoLmerA_k-YtEId7",{auth:{detectSessionInUrl:true,flowType:"implicit",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
function show(text,kind=""){$("message").textContent=text;$("message").className="notice "+kind;}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const email=$("email").value.trim();
 if(!email){show("لطفاً ایمیل را وارد کنید.","error");return;}
 const button=$("send");button.disabled=true;button.textContent="در حال ارسال…";
 try{
  const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:"https://daadelian-bot.github.io/khadem-jame/reset-password.html"});
  if(error) show("ارسال درخواست ناموفق بود: "+error.message,"error");
  else show("درخواست بررسی شد. اگر حسابی با این ایمیل وجود داشته باشد، پیام بازیابی ارسال می‌شود. صندوق ورودی و پوشه هرزنامه را بررسی کنید. لینک را در همان مرورگری باز کنید که می‌خواهید رمز را در آن تغییر دهید.","ok");
 }catch(err){show("خطا هنگام ارسال درخواست: "+(err&&err.message?err.message:"خطای ناشناخته"),"error");}
 button.disabled=false;button.textContent="ارسال لینک بازیابی";
});
</script></body></html>
